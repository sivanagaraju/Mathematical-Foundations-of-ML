  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · IID data", "anchor": "PREREQUISITES.md#p1-iid-px", "prompt": "In this tutorial, what is D?", "options": [{"key": "A", "text": "The discriminator network D_w"}, {"key": "B", "text": "A finite IID sample {x1,…,xn} from unknown p_x (here MNIST train)"}, {"key": "C", "text": "The 100-dimensional noise vector"}, {"key": "D", "text": "The test split used to compute accuracy"}], "answer": "B", "whyCorrect": "He opens with D as the given dataset: IID draws from p_x. MNIST is that pile. Discriminator is D_w, a different object.", "whyOthers": {"A": "D_w is the detector; D without w is the dataset.", "C": "That is z, sampled from N(0,I).", "D": "He downloads train only; no test / no accuracy."}, "diagram": "  p_x --IID--> D = {x1..xn}  (MNIST 28×28)", "useLater": "Topics 1 and 6."}, {"id": "q2", "part": "prerequisites", "tag": "Compare · G vs D", "anchor": "PREREQUISITES.md#p3-g-d", "prompt": "Which input/output pair is correct for vanilla G and D in this hour?", "options": [{"key": "A", "text": "G takes a real photo and outputs z; D takes z and outputs a digit 0–9"}, {"key": "B", "text": "Both take z and output a 28×28 image"}, {"key": "C", "text": "G takes 784 pixels and outputs 100 numbers; D is unused"}, {"key": "D", "text": "G takes z (noise) and outputs a fake image; D takes a real or fake image and outputs P(real)"}], "answer": "D", "whyCorrect": "Generator is the forger: envelope z → photo. Discriminator is the teller: photo → P(y=1).", "whyOthers": {"A": "That would be an encoder plus a classifier. Vanilla G does not encode x.", "B": "Only G outputs an image.", "C": "Sizes reversed; D is the other player."}, "diagram": "  z → G → xhat\n  x or xhat → D → P(real)", "useLater": "Topics 2 and 7."}, {"id": "q3", "part": "prerequisites", "tag": "Trap · G BCE target", "anchor": "PREREQUISITES.md#p5-bce", "prompt": "On the generator step, BCE uses which target, and why?", "options": [{"key": "A", "text": "Ones (real labels): the trick, so D(G(z)) must climb toward 1"}, {"key": "B", "text": "Zeros: they are fakes, so the target is fake"}, {"key": "C", "text": "The MNIST digit 0–9 of the nearest real"}, {"key": "D", "text": "No target; G only maximizes log(1−D) by hand"}], "answer": "A", "whyCorrect": "He says: trick the discriminator; target is the labels of real images, which is 1.", "whyOthers": {"B": "Zeros on G would push D(G(z)) down — look more fake.", "C": "Class labels are unused in vanilla GAN.", "D": "Colab uses BCELoss with ones."}, "diagram": "  G trick:  BCE( D(G(z)) , ones )", "useLater": "Topics 5 and 9."}, {"id": "q4", "part": "prerequisites", "tag": "Compare · ascent vs descent", "anchor": "PREREQUISITES.md#p6-ascent-descent", "prompt": "How does D differ from G when they move on the same J(θ,w)?", "options": [{"key": "A", "text": "Both do gradient descent on J"}, {"key": "B", "text": "Both do gradient ascent on J"}, {"key": "C", "text": "D does gradient ascent (plus); G does gradient descent (minus) and drops term 1"}, {"key": "D", "text": "D descends term 1 only; G ascends term 2 only"}], "answer": "C", "whyCorrect": "w* = argmax → ascent. θ* = argmin → descent. Term 1 has no θ so G drops it.", "whyOthers": {"A": "Descent on J would make D worse on purpose.", "B": "G is a minimization.", "D": "Directions swapped and incomplete."}, "diagram": "  D: w ← w + η ∇J\n  G: θ ← θ − η ∇(term 2)", "useLater": "Topics 4–5."}, {"id": "q5", "part": "prerequisites", "tag": "Trap · detach", "anchor": "PREREQUISITES.md#p7-detach-freeze", "prompt": "Why is discriminator(fake.detach()) required on the D step?", "options": [{"key": "A", "text": "To put the fake on GPU"}, {"key": "B", "text": "So D's backward does not flow into G; θ stays out of that graph"}, {"key": "C", "text": "So G cannot see the fake image"}, {"key": "D", "text": "Detach is required on the G step, not the D step"}], "answer": "B", "whyCorrect": "He: detach so fake is not in the computational graph; gradients need not flow toward G. Freeze-θ in autograd.", "whyOthers": {"A": ".to(device) moves tensors, not detach.", "C": "D must look at the fake; G already produced it.", "D": "G step keeps the tape through D into G."}, "diagram": "  D step: D(G(z).detach())  →  tape cut\n  G step: D(G(z))           →  tape live, but only g_optimizer.step()", "useLater": "Topic 9."}, {"id": "q6", "part": "notes", "tag": "Map · whole lecture", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture", "prompt": "What is the whole-video architecture (master map)?", "options": [{"key": "A", "text": "Train a 10-class MLP on MNIST with cross-entropy and report test accuracy"}, {"key": "B", "text": "Encode MNIST into z with an autoencoder, then decode"}, {"key": "C", "text": "Implement vanilla GAN: two MLPs, J as two BCE terms, D ascent freeze G, G descent trick-ones, two Adams, detach, 50-epoch MNIST trial"}, {"key": "D", "text": "Implement a CNN DCGAN as the only coded model"}], "answer": "C", "whyCorrect": "Exec Summary: chalkboard minmax → runnable train_gan with two MLPs, two Adams, detach, three modes, 50-epoch grids. CNN is homework, not the coded net.", "whyOthers": {"A": "That was W1_T4 classification, not this GAN tutorial.", "B": "z is sampled, never encoded from x.", "D": "He codes MLP; CNN is an exercise."}, "diagram": "  z→G→xhat; x→D; two BCE; two Adams; detach", "useLater": "Closed-book load-bearing claims."}, {"id": "q7", "part": "notes", "tag": "Worked · sizes", "anchor": "NOTES.md#topic-2-two-mlps-z-dim-100-image-dim-784-0245–0535", "prompt": "He sets noise_dim = 100 and MNIST 28×28. How many units are in G's last Linear, and how many in D's last Linear?", "options": [{"key": "A", "text": "G out 784 (then reshape 28×28); D out 1 (sigmoid probability)"}, {"key": "B", "text": "G out 100; D out 10 digit classes"}, {"key": "C", "text": "G out 28; D out 28"}, {"key": "D", "text": "G out 784; D out 10"}], "answer": "A", "whyCorrect": "28×28=784. D is real-vs-fake, so one sigmoid unit, not 10 logits.", "whyOthers": {"B": "100 is the input of G, not the output. 10-way D is the T4 classifier.", "C": "That would be a 28-vector, not an image.", "D": "784 for G is right; 10 for D is the digit-class trap."}, "diagram": "  100 → G → 784 → reshape 28×28\n  784 → D → 1 → sigmoid", "useLater": "Topic 7 stacks."}, {"id": "q8", "part": "notes", "tag": "Connect · term 1 and G", "anchor": "NOTES.md#topic-5-g-descent-drop-term-1-trick-with-ones-1734–2252", "prompt": "Which chain links Topic 3 to Topic 5: why does G drop the first term of J?", "options": [{"key": "A", "text": "Term 1 is too expensive to compute"}, {"key": "B", "text": "Term 1 is only on fakes, so D already owns it"}, {"key": "C", "text": "He never wrote a first term"}, {"key": "D", "text": "Term 1 is E_px[log D(x)] — no θ inside, so it cannot move G"}], "answer": "D", "whyCorrect": "First term is discriminator on real x only. Independent of θ. Remaining piece is log(1−D(G(z))).", "whyOthers": {"A": "Cost is not the reason; independence is.", "B": "Term 1 is on reals, not fakes.", "C": "J has two terms; G just ignores term 1."}, "diagram": "  J = term1(w only) + term2(θ,w)\n         drop for G", "useLater": "Topic 9 G step still only uses D(G(z))."}, {"id": "q9", "part": "notes", "tag": "Trap · Normalize / Tanh", "anchor": "NOTES.md#topic-6-colab-imports-normalize-mnist-128-2252–2547", "prompt": "Why Normalize((0.5,), (0.5,)) together with Tanh on G?", "options": [{"key": "A", "text": "So both reals and fakes live in [−1,1]; one value because MNIST is one channel"}, {"key": "B", "text": "Variance 0.5 is required by Adam"}, {"key": "C", "text": "To turn MNIST into 10 classes"}, {"key": "D", "text": "Tanh wants [0,1]; Normalize is optional cosmetics"}], "answer": "A", "whyCorrect": "ToTensor → [0,1]; (x−0.5)/0.5 → [−1,1]; Tanh also [−1,1]. Single-channel → one tuple entry.", "whyOthers": {"B": "Adam's lr is 2e-4; this is a pixel scale, not Adam.", "C": "Normalize does not create classes.", "D": "Tanh is [−1,1]; mismatch is a failure path in the Exec Summary."}, "diagram": "  [0,1] --(x-0.5)/0.5--> [−1,1] <-- Tanh G", "useLater": "Plot helper undoes it with *0.5+0.5."}, {"id": "q10", "part": "notes", "tag": "Trade-off · modes", "anchor": "NOTES.md#topic-9-train_gan-detach-d-then-g-three-modes-3037–3804", "prompt": "When would you prefer five generator steps versus five discriminator steps, and is 5 holy?", "options": [{"key": "A", "text": "More G steps tend to better fakes; more D steps better real/fake classification; 5 is not holy"}, {"key": "B", "text": "You must always use 5 D steps or the math is invalid"}, {"key": "C", "text": "Modes replace BCE with Wasserstein loss"}, {"key": "D", "text": "one_one is forbidden because theory requires k=5"}], "answer": "A", "whyCorrect": "His words: update G more → good fakes; D more → classify properly. Five is not holy; you can change it. Extra 4 loops implement k=5 after the first step.", "whyOthers": {"B": "He codes all three; 5 is a knob.", "C": "All modes still use BCELoss. Next tutorial is the next flavor.", "D": "one_one is the default body of train_gan."}, "diagram": "  one_one: 1G 1D\n  5G1D: +4 G\n  5D1G: +4 D", "useLater": "Topic 10 extra for _ in range(4)."}, {"id": "q11", "part": "notes", "tag": "Definition · unused labels", "anchor": "NOTES.md#topic-9-train_gan-detach-d-then-g-three-modes-3037–3804", "prompt": "train_loader yields (image, label). What happens to the MNIST class label in vanilla GAN?", "options": [{"key": "A", "text": "It is ignored: unpack (real, _). Ones/zeros mean real/fake, not the digit"}, {"key": "B", "text": "It is the target for D's 10-way softmax"}, {"key": "C", "text": "It is concatenated to z so G can do conditional GAN"}, {"key": "D", "text": "It selects which of 10 generators to run"}], "answer": "A", "whyCorrect": "He: labels are not of consequence in vanilla GAN. real_labels are torch.ones, fake_labels torch.zeros.", "whyOthers": {"B": "D has one sigmoid unit, not 10 classes.", "C": "Conditional GAN is a later flavor, not this notebook.", "D": "One G, one D."}, "diagram": "  (real, _)  →  flatten\n  ones = real tag, zeros = fake tag", "useLater": "Do not mix with T4's y."}, {"id": "q12", "part": "notes", "tag": "Edge · 50 epochs", "anchor": "NOTES.md#topic-10-50-epoch-grids-extra-k-steps-cnn-exercise-3804–4106", "prompt": "After 50 epochs the 8×8 grid is messy. What does he want you to conclude?", "options": [{"key": "A", "text": "The implementation is wrong unless every cell is a perfect digit"}, {"key": "B", "text": "You reconstructed the training set; use test accuracy next"}, {"key": "C", "text": "GANs cannot generate MNIST; skip to diffusion"}, {"key": "D", "text": "50 is a trial run: not great reconstructions (he corrects: generated), but you start to see structure; then try CNN / other data / next flavor"}], "answer": "D", "whyCorrect": "Trial run; not very good; initial stages of images getting generated not reconstructed; outcomes not so great but you can make sense of it. Homework MLP→CNN and other data. Next tutorial = next variation.", "whyOthers": {"A": "He explicitly says outcomes are not so great.", "B": "Generated ≠ reconstructed; no test accuracy.", "C": "The point is the wiring works; flavors come next."}, "diagram": "  epoch 10 blob → 50 some structure\n  generated, not reconstructed", "useLater": "Eyes on fixed_noise are the stopping cue."}, {"id": "q13", "part": "notes", "tag": "Connect · two Adams", "anchor": "NOTES.md#topic-8-two-adams-bce-fixed-noise-2837–3037", "prompt": "Why is one Adam on all parameters a bad complete solution compared with two Adams at lr=2e-4?", "options": [{"key": "A", "text": "Adam cannot handle more than one module"}, {"key": "B", "text": "When you step G, D must stay constant and vice versa; each optimizer owns one parameter pile"}, {"key": "C", "text": "One Adam for Tanh, one for Sigmoid"}, {"key": "D", "text": "BCELoss requires a matching optimizer per term"}], "answer": "B", "whyCorrect": "He: whenever you update G, D values stay constant and vice versa — hence G optimizer and D optimizer. step() on one cannot write the other.", "whyOthers": {"A": "Adam can take any parameter iterable; the issue is freeze, not Adam.", "C": "Activations are not optimized separately.", "D": "One criterion object; two players."}, "diagram": "  g_optimizer → generator.parameters()\n  d_optimizer → discriminator.parameters()", "useLater": "Apply-it scenario 1."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
