  <style>
    :root {

    .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--muted); }

    .part-pill.prereq { background: #1e3a55; color: #8ec8f0; }
    .part-pill.notes { background: #1e4030; color: #8fe0b0; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }

  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · tensor", "prompt": "In this tutorial’s pipeline, what is a tensor?", "options": [{"key": "A", "text": "A JPEG sitting on disk, unconverted"}, {"key": "B", "text": "A numbered grid of values PyTorch can batch (image after ToTensor)"}, {"key": "C", "text": "The CSV of labels only"}, {"key": "D", "text": "The DataLoader shuffle flag"}], "answer": "B", "whyCorrect": "He starts: all data must be (or be converted to) a tensor. ToTensor turns an image matrix into that grid.", "whyOthers": {"A": "The file is not yet a tensor.", "C": "CSV is annotations.", "D": "Shuffle is a loader argument."}, "diagram": "  JPEG --ToTensor--> tensor (C,H,W)", "useLater": "Topics 1 and 4.", "anchor": "PREREQUISITES.md#p1-tensor"}, {"id": "q2", "part": "prerequisites", "tag": "Compare · Dataset vs DataLoader", "prompt": "What does Dataset[i] return, versus what DataLoader yields?", "options": [{"key": "A", "text": "Both return the entire training set as one tensor"}, {"key": "B", "text": "Dataset[i] is a batch of 64; DataLoader returns one image"}, {"key": "C", "text": "Dataset[i] is one (x, y); DataLoader yields a batch (e.g. 64 pairs)"}, {"key": "D", "text": "Neither knows about labels"}], "answer": "C", "whyCorrect": "Dataset is one example. DataLoader wraps it and groups batch_size examples.", "whyOthers": {"A": "That would skip batching.", "B": "Roles reversed.", "D": "Both carry y."}, "diagram": "  Dataset[i] → (x,y)\n  next(loader) → 64×(x,y)", "useLater": "Topics 7–8.", "anchor": "PREREQUISITES.md#p4-dataset-loader"}, {"id": "q3", "part": "prerequisites", "tag": "Trap · CSV columns", "prompt": "In his custom dataset CSV, what are iloc[idx, 0] and iloc[idx, 1]?", "options": [{"key": "A", "text": "0 = label, 1 = relative path"}, {"key": "B", "text": "Both are labels"}, {"key": "C", "text": "They are DataLoader batch indices"}, {"key": "D", "text": "0 = relative path / filename, 1 = label"}], "answer": "D", "whyCorrect": "Join img_dir with column 0, read_image; column 1 is the label.", "whyOthers": {"A": "That swap makes read_image('4') fail.", "B": "No path then.", "C": "idx is the CSV row, not the batch."}, "diagram": "  iloc[idx,0] path\n  iloc[idx,1] label", "useLater": "Topic 7.", "anchor": "PREREQUISITES.md#p6-csv"}, {"id": "q4", "part": "prerequisites", "tag": "Compare · shuffle", "prompt": "How does he treat shuffle on train versus test?", "options": [{"key": "A", "text": "Shuffle both, always, every official snippet is law"}, {"key": "B", "text": "Never shuffle train"}, {"key": "C", "text": "Shuffle train so batch order changes; test shuffle is not mandatory — False makes sense (one eval, no test epochs)"}, {"key": "D", "text": "Shuffle only test"}], "answer": "C", "whyCorrect": "He calls shuffle=True interesting on train. Test: evaluate once; False fits.", "whyOthers": {"A": "He argues against needing True on test.", "B": "Train should shuffle.", "D": "Opposite of his advice."}, "diagram": "  train shuffle=True\n  test  shuffle=False", "useLater": "Topic 8.", "anchor": "PREREQUISITES.md#p8-shuffle"}, {"id": "q5", "part": "prerequisites", "tag": "Definition · dunders", "prompt": "Which three methods does his CustomImageDataset need as a Dataset child?", "options": [{"key": "A", "text": "forward, backward, optimize"}, {"key": "B", "text": "__init__, __len__, __getitem__"}, {"key": "C", "text": "download, ToTensor, plt.show"}, {"key": "D", "text": "shuffle, batch_size, next"}], "answer": "B", "whyCorrect": "Constructor plus the two compulsory Dataset methods. DataLoader calls len and getitem.", "whyOthers": {"A": "That’s a Module later.", "C": "Built-in FashionMNIST path.", "D": "DataLoader kwargs."}, "diagram": "  Dataset ← CustomImageDataset\n  init / len / getitem", "useLater": "Topic 7.", "anchor": "PREREQUISITES.md#p5-dunder"}, {"id": "q6", "part": "notes", "tag": "Map · whole recording", "prompt": "What is the point of this whole lecture’s pipeline (master map)?", "options": [{"key": "A", "text": "Hand-write torch.matmul and autograd for a 2×2 tensor"}, {"key": "B", "text": "Train a GAN for 25 epochs"}, {"key": "C", "text": "Load Fashion-MNIST or a custom Dataset, wrap DataLoader(batch=64), data ready as tensors"}, {"key": "D", "text": "Prove f-divergence is a metric"}], "answer": "C", "whyCorrect": "Title says tensors; he opens Dataset/DataLoader. Lucky builtin or custom class, then batches of 64.", "whyOthers": {"A": "Title trap — not in the captions.", "B": "Later week.", "D": "W1_L3."}, "diagram": "  files → Dataset → DataLoader(64) → batches", "useLater": "Executive Summary approach card.", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture"}, {"id": "q7", "part": "notes", "tag": "Worked · FashionMNIST flags", "prompt": "Which constructor loads the evaluation split into ./data, downloading if needed, as tensors?", "options": [{"key": "A", "text": "FashionMNIST(root='data', train=False, download=True, transform=ToTensor())"}, {"key": "B", "text": "FashionMNIST(root='data', train=True, download=False) with no transform"}, {"key": "C", "text": "DataLoader(train=False)"}, {"key": "D", "text": "pd.read_csv('FashionMNIST')"}], "answer": "A", "whyCorrect": "train=False is test. root=data under cwd. download=True if missing. ToTensor converts the image matrix.", "whyOthers": {"B": "That’s train, and skips ToTensor.", "C": "DataLoader wraps a Dataset; it is not the split flag.", "D": "CSV is the custom path."}, "diagram": "  train=True  train pile\n  train=False test pile", "useLater": "Topic 4.", "anchor": "NOTES.md#topic-4-fashionmnist-traintest-0417–0609"}, {"id": "q8", "part": "notes", "tag": "Connect · lucky vs custom", "prompt": "When would you prefer CustomImageDataset rather than FashionMNIST?", "options": [{"key": "A", "text": "Always; torchvision is deprecated"}, {"key": "B", "text": "When data is custom / sensitive / not in the PyTorch repository"}, {"key": "C", "text": "Only for CIFAR-10"}, {"key": "D", "text": "Never; DataLoader downloads by itself"}], "answer": "B", "whyCorrect": "Lucky = in the repo. Unlucky = curate folder+CSV and a wrapper.", "whyOthers": {"A": "He uses FashionMNIST first.", "C": "CIFAR is also builtin.", "D": "Loader does not replace Dataset download."}, "diagram": "  in repo → FashionMNIST\n  not in repo → custom class", "useLater": "Topics 5–7.", "anchor": "NOTES.md#topic-5-plots-when-the-repo-is-not-enough-0609–0741"}, {"id": "q9", "part": "notes", "tag": "Worked · getitem", "prompt": "In __getitem__(idx), after join+read_image, where is the label?", "options": [{"key": "A", "text": "self.img_labels.iloc[idx, 1]"}, {"key": "B", "text": "self.img_labels.iloc[idx, 0]"}, {"key": "C", "text": "batch_size"}, {"key": "D", "text": "plt.imshow"}], "answer": "A", "whyCorrect": "Column 0 is the relative path; column 1 is the label. Then optional target_transform.", "whyOthers": {"B": "That’s the path used in os.path.join.", "C": "Loader, not Dataset.", "D": "Plotting skipped."}, "diagram": "  iloc[idx,0] → path → read_image\n  iloc[idx,1] → label", "useLater": "Topic 7.", "anchor": "NOTES.md#topic-7-customimagedataset-1021–1506"}, {"id": "q10", "part": "notes", "tag": "Definition · batch", "prompt": "After DataLoader(..., batch_size=64), how many (x, y) pairs are in each Di?", "options": [{"key": "A", "text": "The entire test set as one tensor"}, {"key": "B", "text": "64 pairs (x_j, y_j), j = 1..64"}, {"key": "C", "text": "A single JPEG path string"}, {"key": "D", "text": "Ten class names as text"}], "answer": "B", "whyCorrect": "He writes each batch as 64 tuples of image and label. Data ends as tensors.", "whyOthers": {"A": "That’s not a batch of 64.", "C": "Custom getitem already read the image.", "D": "Labels are integers 0–9."}, "diagram": "  D1..Dk  each |Di|=64 (x,y)", "useLater": "Topic 8; next tutorial eats these batches.", "anchor": "NOTES.md#topic-8-dataloader-batch-64-shuffle-1506–1826"}, {"id": "q11", "part": "notes", "tag": "Worked · iterator next", "prompt": "He says access the loader with iterator / next. What does next(iter(train_dataloader)) return?", "options": [{"key": "A", "text": "The entire 60,000-image training set as one tensor"}, {"key": "B", "text": "A single JPEG path string from column 0"}, {"key": "C", "text": "Python’s len(dataset)"}, {"key": "D", "text": "One batch: images and labels stacked, about 64 pairs"}], "answer": "D", "whyCorrect": "iter starts walking the loader; next takes one step. For DataLoader that step is one Di of batch_size pairs, not one file.", "whyOthers": {"A": "That skips batching.", "B": "That’s Dataset/CSV, not the loader peek.", "C": "__len__ is how many examples, not a batch."}, "diagram": "  next(iter(loader)) → one Di of 64 (x,y)", "useLater": "Topic 8 peek; training loop is for images, labels in loader.", "anchor": "NOTES.md#topic-8-dataloader-batch-64-shuffle-1506–1826"}, {"id": "q12", "part": "notes", "tag": "Trap · official cell vs his advice", "prompt": "The Colab cell he opens often sets shuffle=True on both train and test loaders. What does he argue?", "options": [{"key": "A", "text": "Keep True on train; False makes sense on test because you evaluate once (no test epochs)"}, {"key": "B", "text": "Always copy the snippet; True on test is mandatory"}, {"key": "C", "text": "Never shuffle train"}, {"key": "D", "text": "Shuffle mixes the train pile into the test pile"}], "answer": "A", "whyCorrect": "He calls shuffle=True interesting on train. Test True is not mandatory; False fits one evaluation sitting.", "whyOthers": {"B": "He explicitly disagrees with needing True on test.", "C": "Train should shuffle so batch order changes.", "D": "Shuffle only permutes order inside that split."}, "diagram": "  official: both True\n  his advice: train True, test False", "useLater": "Topic 8 vs the notebook on screen.", "anchor": "NOTES.md#topic-8-dataloader-batch-64-shuffle-1506–1826"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
