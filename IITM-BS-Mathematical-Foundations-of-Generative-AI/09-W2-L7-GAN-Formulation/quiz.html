  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · freeze", "anchor": "PREREQUISITES.md#p5-freeze", "prompt": "In this lecture’s warm-up, what is “freeze” closest to?", "options": [{"key": "A", "text": "Delete that net from the graph so no forward pass happens"}, {"key": "B", "text": "Set every weight of that net to zero"}, {"key": "C", "text": "Do not update those weights this step (you may still run the net)"}, {"key": "D", "text": "Stop the whole training loop for an epoch"}], "answer": "C", "whyCorrect": "Freeze means: do not change that net’s parameters. You still run G to make fakes on a D step, and you still pass gradients through frozen D on a G step.", "whyOthers": {"A": "A frozen net is used, not removed. G must still produce x-hat while D trains.", "B": "Weights stay at their current values; they are not zeroed.", "D": "Freeze is per-step, not “pause the epoch.”"}, "diagram": "  train D:  G frozen (run only)     D updates\n  train G:  D frozen (run + pass grads)  G updates", "useLater": "Topics 5–7: green = trained net; red = backprop; the other net’s weights stay put."}, {"id": "q2", "part": "prerequisites", "tag": "Compare · plus vs minus", "anchor": "PREREQUISITES.md#p6-ascent", "prompt": "How does a discriminator step differ from ordinary gradient descent rather than using the same sign?", "options": [{"key": "A", "text": "D maximizes J, so w ← w + α ∇_w J (ascent); G still uses minus"}, {"key": "B", "text": "Both nets always use minus because “all of ML is descent”"}, {"key": "C", "text": "D uses minus on θ and plus on w in one simultaneous grab"}, {"key": "D", "text": "D never uses a gradient; only G does"}], "answer": "A", "whyCorrect": "Typical supervised training shrinks a loss (minus). D climbs the shared score J, so the tablet writes a plus. That opposite walk is the adversarial part.", "whyOthers": {"B": "He may say “gradient descent” while writing a plus on w. The sign on the board is the law.", "C": "He alternates; he does not update both in one grab today.", "D": "D’s plus-step is a real gradient step on w."}, "diagram": "  D:  w  ←  w  + α1 ∇_w J     (ascent)\n  G:  θ  ←  θ  − α2 ∇_θ J     (descent)", "useLater": "Topics 3 and 5. A stock loss.backward() descent trainer on J for D is the intern trap."}, {"id": "q3", "part": "prerequisites", "tag": "Worked · batch average", "anchor": "PREREQUISITES.md#p3-batch", "prompt": "A real batch of size B1 = 2 has log D values −0.1 and −0.3. Compute the first-term batch average he would type.", "options": [{"key": "A", "text": "−0.4  (the sum, no 1/B1)"}, {"key": "B", "text": "−0.1  (keep only the first file)"}, {"key": "C", "text": "0  (expectations are always zero in code)"}, {"key": "D", "text": "−0.2  = (−0.1 + −0.3) / 2"}], "answer": "D", "whyCorrect": "Replace E_{p_x} log D(x) by (1/B1) Σ log D(x_i). Two numbers, divide by two.", "whyOthers": {"A": "He writes a mean, not a raw sum.", "B": "Both files in the batch count.", "C": "The population mean is unknown; the batch mean is a number, not identically zero."}, "diagram": "  E log D(x)  ≈  (1/B1) Σ_{i=1}^{B1} log D(x_i)\n  (−0.1 + −0.3)/2 = −0.2", "useLater": "Topic 3: two plates, B1 reals and B2 fakes, possibly different sizes."}, {"id": "q4", "part": "prerequisites", "tag": "Trade-off · drop first term", "anchor": "PREREQUISITES.md#p4-jgan", "prompt": "When would you drop the log-D-on-reals term, and what should the G step use instead?", "options": [{"key": "A", "text": "Always drop it, even when training D — reals never matter"}, {"key": "B", "text": "When training G: first term does not depend on θ, so use only mean log(1−D(G(z)))"}, {"key": "C", "text": "When training D: drop fakes so D only sees the museum"}, {"key": "D", "text": "Never drop it; G must average log D(x_real) so θ sees the data"}], "answer": "B", "whyCorrect": "E_{p_x} log D(x) does not mention G. For a G step it is a constant. Code that puts reals into the G loss is wasted motion.", "whyOthers": {"A": "D’s job uses both terms. Dropping reals would blind the detective to the museum.", "C": "D needs fakes too — that is the second term.", "D": "That is the intern trap in Apply-it Scenario 1."}, "diagram": "  J =  log D(reals)  +  log(1−D(G(z)))\n            ↑ ignore for G         ↑ this is G’s loss", "useLater": "Topics 4 and 7: G training needs no real x."}, {"id": "q5", "part": "notes", "tag": "Map · whole lecture", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture", "prompt": "What is the point of this lecture’s master map — the whole-lecture job this sitting actually installs?", "options": [{"key": "A", "text": "Pick CNN vs MLP weights and run a Colab notebook"}, {"key": "B", "text": "Prove a new f-divergence and skip training"}, {"key": "C", "text": "Train two nets on one score J_GAN by alternate frozen batch steps: plus on w, minus on θ; stop by sample quality"}, {"key": "D", "text": "Read D as a classifier and do conditional generation"}], "answer": "C", "whyCorrect": "You hold n IID files and two nets. Share J_GAN, maximize in w, minimize in θ, alternating on batch averages. D needs real+fake; G needs only fakes. Stop by looking at samples.", "whyOthers": {"A": "Architecture-agnostic today; tutorials pick a net later. No Colab on this tape.", "B": "The f-choice was last lecture. This hour is the procedure.", "D": "Classifier interpretation and inference are the next module (STOP box)."}, "diagram": "  freeze θ → w ← w + α1 ∇_w J\n  freeze w → θ ← θ − α2 ∇_θ J\n  STOP: look at samples", "useLater": "Closed-book load-bearing claims in the Executive Summary."}, {"id": "q6", "part": "notes", "tag": "Connect · Topic 4 → 7", "anchor": "NOTES.md#topic-7-train-g-no-real-data-grads-through-d-2038–2841", "prompt": "Which chain links Topic 4 (drop the first term) to Topic 7 (train G)?", "options": [{"key": "A", "text": "First term independent of θ ⇒ G step uses no real x; z → G → frozen D; minus α2"}, {"key": "B", "text": "First term independent of θ ⇒ OTES.md#topic-6-train-d-real-batch-frozen-g-1137–2038", "prompt": "How does one D step differ from one G step on what you feed and which weights move?", "options": [{"key": "A", "text": "Both steps update w and θ together from the same backward()"}, {"key": "B", "text": "D: real batch + frozen-G fakes, plus on w. G: only z, frozen D, minus on θ"}, {"key": "C", "text": "D uses only fakes; G uses only reals"}, {"key": "D", "text": "D minus-steps w; G plus-steps θ"}], "answer": "B", "whyCorrect": "Green = the net being trained. D needs both piles and a plus. G needs Gaussians, a frozen detective, and a minus. Real batch is a random subset of D, not necessarily contiguous.", "whyOthers": {"A": "Freeze is the whole point. Simultaneous grab is out of scope today.", "C": "Swapped. D needs reals; G does not.", "D": "Signs swapped. That would train D downhill on J."}, "diagram": "  D-step:  x_real, G(z)  →  w ← w + α1 ∇_w J\n  G-step:  G(z) only     →  θ ← θ − α2 ∇_θ J", "useLater": "Topics 6–7 commented Python; green forward, red backprop."}, {"id": "q9", "part": "notes", "tag": "Worked · plus step", "anchor": "NOTES.md#topic-3-batch-averages-d-plus-step-0427–0636", "prompt": "D-step: α1 = 0.1 and ∇_w J equals +2 (same shape as a scalar w). Compute the update he writes for w.", "options": [{"key": "A", "text": "w ← w − 0.2  (ordinary descent)"}, {"key": "B", "text": "w ← 2"}, {"key": "C", "text": "w ← w + 0.2"}, {"key": "D", "text": "w ← w + 0.1  (ignore the gradient value)"}], "answer": "C", "whyCorrect": "Maximize ⇒ plus learning rate times gradient. 0.1 × 2 = 0.2, added to w. α1 and α2 may differ later.", "whyOthers": {"A": "Minus is G’s sign, or a stock descent trainer — Apply-it Scenario 2.", "B": "It is an increment, not a replacement by the gradient.", "D": "You multiply by the gradient, not by 1."}, "diagram": "  w ← w + α1 ∇_w J\n  w ← w + 0.1 · 2  =  w + 0.2", "useLater": "Topic 5: the plus vs minus *is* the adversarial part."}, {"id": "q10", "part": "notes", "tag": "Definition · J_GAN", "anchor": "NOTES.md#topic-2-dσv-j_gan-alternate-0228–0427", "prompt": "What is J_GAN closest to on this tape?", "options": [{"key": "A", "text": "E_{p_x} log D_w(x) + E_{p_θ} log(1 − D_w(x̂)), with D = σ(V) in (0,1)"}, {"key": "B", "text": "Only the MSE between x and G(z)"}, {"key": "C", "text": "A classifier cross-entropy that never uses fakes"}, {"key": "D", "text": "The explicit density p_θ(x) we maximize by MLE"}], "answer": "A", "whyCorrect": "Last lecture’s T became D = σ(V). The bound is log D on reals plus log(1−D) on fakes. Same J is max for w and min for θ.", "whyOthers": {"B": "No reconstruction loss on this tape.", "C": "The fake term is the second expectation. Classifier reading is next module.", "D": "G is implicit: samples, not a formula for p_θ(x)."}, "diagram": "  J_GAN(θ,w) = E log D(x) + E log(1−D(G(z)))", "useLater": "Topic 9: this is one f of variational divergence minimization."}, {"id": "q11", "part": "notes", "tag": "Trade-off · k:1 and stop", "anchor": "NOTES.md#topic-8-k1-steps-no-stopping-formula-2841–3008", "prompt": "When would you leave 1:1 steps, and how should you decide to stop on this tape?", "options": [{"key": "A", "text": "Never leave 1:1; stop when J hits exactly 0"}, {"key": "B", "text": "Sometimes k D-steps per G-step (or the reverse); stop when generated samples look good enough on metrics"}, {"key": "C", "text": "Always five G steps only, then halt after one epoch"}, {"key": "D", "text": "Stop when the real batch is contiguous files from disk"}], "answer": "B", "whyCorrect": "He says typically alternate one and one, then the practical tip: not always 1:1. There is no well-defined stopping criterion; look at p_θ quality / metrics. Classifier-based stopping is next module.", "whyOthers": {"A": "1:1 is typical, not required. J wiggling to 0 is not the rule.", "C": "Five-and-one is an example, not a law, and one epoch is not “done.”", "D": "The real batch is a random subset; contiguity is not a stopping rule."}, "diagram": "  LOOP: 1:1  or  k:1  (either way)\n  STOP: sample quality / metrics — no formula", "useLater": "Topic 10 recap; Apply-it Scenario 4."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {

          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;

        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");

        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
