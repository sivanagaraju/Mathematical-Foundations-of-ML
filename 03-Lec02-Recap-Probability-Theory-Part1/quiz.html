<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Quiz · Lec 02 Probability Recap Part 1</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --panel2: #243044; --text: #e7ecf3;
      --muted: #9aabbf; --accent: #5b9fd4; --ok: #3dba7a; --bad: #e06c75;
      --warn: #e5c07b; --border: #2d3a4f;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #1a2838 0%, var(--bg) 100%); }
    header h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 52rem; }
    header a { color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; align-items: center; }
    .mode-toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 0.45rem 0.9rem; cursor: pointer; font: inherit; }
    .mode-toggle button.active { background: var(--accent); color: #0b1220; font-weight: 600; }
    main { padding: 1.25rem 1.5rem 3rem; max-width: 52rem; margin: 0 auto; }
    .progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .qcard h2 { margin: 0 0 0.35rem; font-size: 1.02rem; font-weight: 650; }
    .qmeta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .opts { display: flex; flex-direction: column; gap: 0.45rem; }
    .opt { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: #1e3348; box-shadow: inset 0 0 0 1px var(--accent); }
    .opt input { margin-top: 0.25rem; accent-color: var(--accent); }
    .opt.reveal-correct { border-color: var(--ok); background: #163528; }
    .opt.reveal-wrong-picked { border-color: var(--bad); background: #3a1f24; }
    .q-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
    .q-actions button { font: inherit; border-radius: 8px; padding: 0.5rem 0.95rem; cursor: pointer; border: 1px solid var(--border); }
    .q-actions .check-btn { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    .q-actions .check-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .q-actions .clear-btn { background: var(--panel2); color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.25rem 0; position: sticky; bottom: 0; padding: 0.75rem 0; background: linear-gradient(transparent, var(--bg) 30%); }
    button.primary, button.secondary { font: inherit; border-radius: 8px; padding: 0.65rem 1.1rem; cursor: pointer; border: 1px solid var(--border); }
    button.primary { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--text); }
    .score { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.25rem; }
    .score.show { display: block; }
    .explain { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .explain.show { display: block; }
    .explain h3 { margin: 0.75rem 0 0.4rem; font-size: 0.92rem; color: var(--warn); }
    .verdict { font-weight: 650; margin-bottom: 0.5rem; }
    .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--muted); }
    .why { background: #121a24; border-radius: 8px; padding: 0.75rem 0.9rem; margin: 0.45rem 0; font-size: 0.92rem; }
    .why .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 0.25rem; }
    pre.diagram { font-family: var(--mono); font-size: 0.76rem; line-height: 1.35; background: #0b1018; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; overflow-x: auto; color: #c5d4e8; margin: 0.55rem 0; white-space: pre; }
    .later { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .wizard-nav { display: none; gap: 0.5rem; }
    body.mode-wizard .wizard-nav { display: flex; }
    body.mode-wizard .qcard { display: none; }
    body.mode-wizard .qcard.active { display: block; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 1rem 2rem; }
    .part-banner { margin: 1.25rem 0 0.75rem; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: #152032; }
    .part-banner h2 { margin: 0 0 0.25rem; font-size: 1.05rem; color: var(--accent); }
    .part-banner p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .part-banner.notes { border-color: #3d5a40; background: #15241a; }
    .part-banner.notes h2 { color: var(--ok); }
    .part-pill { display: inline-block; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 999px; margin-right: 0.4rem; }
    .part-pill.prereq { background: #1e3a55; color: #8ec8f0; }
    .part-pill.notes { background: #1e4030; color: #8fe0b0; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
  </style>

  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Warm-up · sets", "anchor": "PREREQUISITES.md#p1-sets", "prompt": "A set is best thought of as:", "options": [{"key": "A", "text": "An ordered list where duplicates always count twice"}, {"key": "B", "text": "A collection of distinct objects (order does not matter)"}, {"key": "C", "text": "Only infinite collections of real numbers"}, {"key": "D", "text": "A neural network weight matrix"}], "answer": "B", "whyCorrect": "Sets are bags of distinct members; order is irrelevant.", "whyOthers": {"A": "That is closer to sequences or multisets.", "C": "Finite sets like {H,T} or {1..6} are valid.", "D": "Weight matrices are later mathematical objects, not the definition of a set."}, "diagram": "  S = { apple, banana } · grape ∉ S", "useLater": "Sample space Ω is a set of outcomes."}, {"id": "q2", "part": "prerequisites", "tag": "Warm-up · subsets / events", "anchor": "PREREQUISITES.md#p2-subsets", "prompt": "If Ω is the set of die faces {1..6}, which best matches the event “even roll”?", "options": [{"key": "A", "text": "The single number 3.5"}, {"key": "B", "text": "Any number larger than 6"}, {"key": "C", "text": "The subset A = {2, 4, 6} ⊆ Ω"}, {"key": "D", "text": "The empty set only, because even is impossible"}], "answer": "C", "whyCorrect": "Everyday questions about outcomes become subsets of Ω (events).", "whyOthers": {"A": "3.5 is not a face of this die model.", "B": "Those values are outside Ω in this model.", "D": "Even rolls are possible; empty set is the impossible event."}, "diagram": "  Ω={1..6} · A={2,4,6} even", "useLater": "Elements of F are events = subsets of Ω."}, {"id": "q3", "part": "prerequisites", "tag": "Warm-up · functions", "anchor": "PREREQUISITES.md#p3-functions", "prompt": "A function f : X → Y is:", "options": [{"key": "A", "text": "Any random guess with no rule"}, {"key": "B", "text": "The training dataset itself"}, {"key": "C", "text": "Always a straight line only"}, {"key": "D", "text": "A rule sending each allowed x in X to exactly one y in Y"}], "answer": "D", "whyCorrect": "One input, one output — a reliable map between sets.", "whyOthers": {"A": "That is not a function.", "B": "Data is pairs; f is the map.", "C": "Lines are one class of functions, not all functions."}, "diagram": "  x ──f──► y", "useLater": "Random variables are deterministic functions of outcomes."}, {"id": "q4", "part": "prerequisites", "tag": "Warm-up · function approximation", "anchor": "PREREQUISITES.md#p3b-fa", "prompt": "In this course, function approximation (FA) means:", "options": [{"key": "A", "text": "Estimate an unknown map f from data so new inputs can still get predicted outputs"}, {"key": "B", "text": "Only memorize the training pairs and refuse to answer on new x"}, {"key": "C", "text": "Replace all labels with random noise"}, {"key": "D", "text": "Prove that Ω must equal the real line"}], "answer": "A", "whyCorrect": "FA is the ML goal: estimate f for prediction on new inputs.", "whyOthers": {"B": "That is table lookup / overfitting seed, not approximation for prediction.", "C": "Opposite of learning labels.", "D": "Ω need not be numeric; FA is about maps, not that claim."}, "diagram": "  (x,y) pairs → estimate f → predict on x_new", "useLater": "Probability tools still serve this prediction goal."}, {"id": "q5", "part": "prerequisites", "tag": "Warm-up · measure", "anchor": "PREREQUISITES.md#p4-measure", "prompt": "Why introduce length as a measure on subsets of the real line?", "options": [{"key": "A", "text": "So every set is forced to contain only integers"}, {"key": "B", "text": "To assign a size and compare which subset is bigger (e.g. [0,1] vs [0,10])"}, {"key": "C", "text": "To rename every set to the empty set"}, {"key": "D", "text": "To replace sets with neural networks"}], "answer": "B", "whyCorrect": "Without a size (measure), two infinite subsets cannot be compared by counting points alone.", "whyOthers": {"A": "Intervals contain continuum many points, not only integers.", "C": "Length does not empty sets.", "D": "Unrelated."}, "diagram": "  [0,1] length 1 · [0,10] length 10", "useLater": "Probability is a different measure on subsets of Ω."}, {"id": "q6", "part": "prerequisites", "tag": "Warm-up · cake / [0,1]", "anchor": "PREREQUISITES.md#p5-unit", "prompt": "For a probability measure P, which is required?", "options": [{"key": "A", "text": "P(Ω) equals the integer count of outcomes only"}, {"key": "B", "text": "P(A) can be 100 for some events"}, {"key": "C", "text": "P(Ω) = 1 and each event gets a size in [0, 1]"}, {"key": "D", "text": "P is only defined on single numbers, never on sets"}], "answer": "C", "whyCorrect": "Probability normalizes the whole sample space to size 1 and maps events into [0,1].", "whyOthers": {"A": "Count of outcomes is not the same as P(Ω)=1.", "B": "Probability is upper-bounded by 1.", "D": "P acts on events (subsets), not only on scalars."}, "diagram": "  whole cake Ω size 1 · slice A size P(A)", "useLater": "Cake rules reappear as properties of P."}, {"id": "q7", "part": "notes", "tag": "Master map", "anchor": "NOTES.md#executive-summary--whole-lecture-in-one-map", "prompt": "On the master map, this lecture’s arc is best described as:", "options": [{"key": "A", "text": "From convolutional nets to transformers only"}, {"key": "B", "text": "From calculus to linear algebra with no probability"}, {"key": "C", "text": "From deployment dashboards to monitoring only"}, {"key": "D", "text": "From function approximation (estimate f) toward random experiment → Ω → events → P"}], "answer": "D", "whyCorrect": "Exec Summary: bridge FA prediction goal to the probability pipeline built in Part 1.", "whyOthers": {"A": "Architectures are not this lecture’s spine.", "B": "Probability is the point of the bridge.", "C": "Ops is not the map."}, "diagram": "  estimate f  ──►  RE → Ω → F → P", "useLater": "All topics are boxes on this arc."}, {"id": "q8", "part": "notes", "tag": "Topic 1 · physics fails", "anchor": "NOTES.md#topic-1-from-function-approximation-to-why-physics-fails-0002–0353", "prompt": "Why is physics-first function approximation hard for X-ray disease labels?", "options": [{"key": "A", "text": "Measurements are about light; labels (diseased/not) are abstract clinical concepts"}, {"key": "B", "text": "X-rays are always infinite resolution"}, {"key": "C", "text": "Sets cannot contain two labels"}, {"key": "D", "text": "Prediction is never useful in medicine"}], "answer": "A", "whyCorrect": "Semantic gap: physics of light vs abstract clinical labels.", "whyOthers": {"B": "Resolution is not the argument he makes.", "C": "{0,1} is a valid label set.", "D": "Prediction is the motivation for FA."}, "diagram": "  light measure ≠ disease concept", "useLater": "Motivates the statistical path next."}, {"id": "q9", "part": "notes", "tag": "Topic 2 · bridge slogan", "anchor": "NOTES.md#topic-2-statistical-turn-and-the-function-approximation--distribution-bridge-0353–0554", "prompt": "What gap does the lecturer say people often miss?", "options": [{"key": "A", "text": "That sample spaces must be empty"}, {"key": "B", "text": "That estimating a distribution is what function learning becomes in the probabilistic view"}, {"key": "C", "text": "That labels are never subjective"}, {"key": "D", "text": "That physics always gives f exactly in one measurement"}], "answer": "B", "whyCorrect": "He bridges neat FA language to distribution estimation language.", "whyOthers": {"A": "Opposite of the construction.", "C": "He later notes labels can be subjective.", "D": "Physics-first is often blocked."}, "diagram": "  learn f  ≈  estimate distribution", "useLater": "Rest of course uses this identification."}, {"id": "q10", "part": "notes", "tag": "Topic 3 · random experiment", "anchor": "NOTES.md#topic-3-decide-under-uncertainty-the-random-experiment-0554–0918", "prompt": "After the random experiment and its outcomes are fixed, what happens next in the formal theory?", "options": [{"key": "A", "text": "Every theorem becomes non-deterministic forever"}, {"key": "B", "text": "Sample spaces become illegal"}, {"key": "C", "text": "The rest is set theory and measure theory (randomness language mostly stops)"}, {"key": "D", "text": "Functions are forbidden"}], "answer": "C", "whyCorrect": "After RE + outcomes, work with sets/measures; RV is a deterministic function of outcomes.", "whyOthers": {"A": "RV is a deterministic function of outcomes.", "B": "Ω is exactly the set of outcomes.", "D": "Functions appear everywhere after."}, "diagram": "  RE → outcomes → sets/measures", "useLater": "Designer chooses the RE."}, {"id": "q11", "part": "notes", "tag": "Topic 4 · ML as RE", "anchor": "NOTES.md#topic-4-every-ml-datapoint-comes-from-a-random-experiment-0918–1211", "prompt": "In the X-ray labeling story, the random experiment is best described as:", "options": [{"key": "A", "text": "Only the final JPEG compression setting"}, {"key": "B", "text": "Only the brand of the hospital coffee machine"}, {"key": "C", "text": "A single floating-point constant with no process"}, {"key": "D", "text": "The whole pipeline: disease → radiology → imaging → upload → clinician label"}], "answer": "D", "whyCorrect": "He defines the RE as the entire clinical imaging and labeling process.", "whyOthers": {"A": "Compression is a detail, not the RE.", "B": "Not the lecture’s definition.", "C": "Outcomes come from an experiment process."}, "diagram": "  person→scan→file→label = RE", "useLater": "Every datapoint arises from some RE."}, {"id": "q12", "part": "notes", "tag": "Topic 5 · sample space", "anchor": "NOTES.md#topic-5-sample-space-omega-1211–1413", "prompt": "The sample space Ω is:", "options": [{"key": "A", "text": "The set of all possible outcomes of the random experiment"}, {"key": "B", "text": "Only the training loss curve"}, {"key": "C", "text": "Always equal to the empty set"}, {"key": "D", "text": "The name of a particular GPU kernel"}], "answer": "A", "whyCorrect": "Definition: sample space = set of all possible outcomes.", "whyOthers": {"B": "Loss curves are optimization artifacts.", "C": "Empty would mean no outcomes.", "D": "Unrelated."}, "diagram": "  RE → Ω = {outcomes}", "useLater": "Events are subsets of Ω."}, {"id": "q13", "part": "notes", "tag": "Topic 7 · non-numeric Ω", "anchor": "NOTES.md#topic-7-subsets-of-omega-events-and-the-need-for-p-1731–2243", "prompt": "Which claim about Ω does the lecturer emphasize?", "options": [{"key": "A", "text": "Ω must always be a subset of ℝ by definition"}, {"key": "B", "text": "Ω need not be numeric (e.g. coin faces H/T have no numerical notion yet)"}, {"key": "C", "text": "Ω cannot contain more than one outcome"}, {"key": "D", "text": "Ω is the same as a trained model"}], "answer": "B", "whyCorrect": "He insists sample space can be abstract; quantification via RVs comes later.", "whyOthers": {"A": "Explicitly denied for coin/X-ray stories.", "C": "Many outcomes are allowed.", "D": "Model is not the sample space."}, "diagram": "  Ω = {H,T} not numbers yet", "useLater": "P still maps subsets of abstract Ω to [0,1]."}, {"id": "q14", "part": "notes", "tag": "Topic 8 · properties of P", "anchor": "NOTES.md#topic-8-probability-measure-p--properties-meaning-abstraction-2243–3213", "prompt": "Which list matches the properties of P as taught?", "options": [{"key": "A", "text": "P(A) always equals the pixel count of an image"}, {"key": "B", "text": "P(Ω) must be 0"}, {"key": "C", "text": "P(A)≥0, P(A)≤1, P(Ω)=1, P(∅)=0, and disjoint events add"}, {"key": "D", "text": "P is undefined on the empty set forever"}], "answer": "C", "whyCorrect": "Non-negativity, bound by 1, unit mass on Ω, zero on empty, additivity for disjoint events.", "whyOthers": {"A": "P is not pixel counting.", "B": "P(Ω)=1, not 0.", "D": "P(∅)=0 is defined."}, "diagram": "  P:F→[0,1] · cake rules", "useLater": "Optional likelihood reading of P(A)."}, {"id": "q15", "part": "notes", "tag": "Topic 8 · meaning deferred", "anchor": "NOTES.md#topic-8-probability-measure-p--properties-meaning-abstraction-2243–3213", "prompt": "According to the lecture, when does assigning a “likelihood” meaning to P become especially important?", "options": [{"key": "A", "text": "Before any matrix multiplication can run"}, {"key": "B", "text": "Only when Ω is empty"}, {"key": "C", "text": "Never — meaning is always forbidden"}, {"key": "D", "text": "When a clinician must turn the algorithm into a diagnosis for a patient"}], "answer": "D", "whyCorrect": "ML math can run without meaning until real decisions (e.g. diagnosis) force interpretation.", "whyOthers": {"A": "Computation uses the formal measure.", "B": "Empty Ω is not the point.", "C": "Meaning is deferred, not forever forbidden."}, "diagram": "  abstract P ──later──► clinical meaning", "useLater": "Abstraction enables generalist view of data as vectors."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
