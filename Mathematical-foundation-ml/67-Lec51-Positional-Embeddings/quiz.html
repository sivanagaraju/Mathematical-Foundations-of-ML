<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Lec 51 Positional Embeddings</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --panel2: #243044; --text: #e7ecf3;
      --muted: #9aabbf; --accent: #5b9fd4; --ok: #3dba7a; --bad: #e06c75;
      --warn: #e5c07b; --border: #2d3a4f;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #1a2838 0%, var(--bg) 100%); }
    header h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 52rem; }
    header a { color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; align-items: center; }
    .mode-toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 0.45rem 0.9rem; cursor: pointer; font: inherit; }
    .mode-toggle button.active { background: var(--accent); color: #0b1220; font-weight: 600; }
    main { padding: 1.25rem 1.5rem 3rem; max-width: 52rem; margin: 0 auto; }
    .progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .qcard h2 { margin: 0 0 0.35rem; font-size: 1.02rem; font-weight: 650; }
    .qmeta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .opts { display: flex; flex-direction: column; gap: 0.45rem; }
    .opt { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: #1e3348; box-shadow: inset 0 0 0 1px var(--accent); }
    .opt input { margin-top: 0.25rem; accent-color: var(--accent); }
    .opt.reveal-correct { border-color: var(--ok); background: #163528; }
    .opt.reveal-wrong-picked { border-color: var(--bad); background: #3a1f24; }
    .q-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
    .q-actions button { font: inherit; border-radius: 8px; padding: 0.5rem 0.95rem; cursor: pointer; border: 1px solid var(--border); }
    .q-actions .check-btn { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    .q-actions .check-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .q-actions .clear-btn { background: var(--panel2); color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.25rem 0; position: sticky; bottom: 0; padding: 0.75rem 0; background: linear-gradient(transparent, var(--bg) 30%); }
    button.primary, button.secondary { font: inherit; border-radius: 8px; padding: 0.65rem 1.1rem; cursor: pointer; border: 1px solid var(--border); }
    button.primary { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--text); }
    .score { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.25rem; }
    .score.show { display: block; }
    .explain { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .explain.show { display: block; }
    .explain h3 { margin: 0.75rem 0 0.4rem; font-size: 0.92rem; color: var(--warn); }
    .verdict { font-weight: 650; margin-bottom: 0.5rem; }
    .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--muted); }
    .why { background: #121a24; border-radius: 8px; padding: 0.75rem 0.9rem; margin: 0.45rem 0; font-size: 0.92rem; }
    .why .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 0.25rem; }
    pre.diagram { font-family: var(--mono); font-size: 0.76rem; line-height: 1.35; background: #0b1018; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; overflow-x: auto; color: #c5d4e8; margin: 0.55rem 0; white-space: pre; }
    .later { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .wizard-nav { display: none; gap: 0.5rem; }
    body.mode-wizard .wizard-nav { display: flex; }
    body.mode-wizard .qcard { display: none; }
    body.mode-wizard .qcard.active { display: block; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 1rem 2rem; }
    .part-banner { margin: 1.25rem 0 0.75rem; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: #152032; }
    .part-banner h2 { margin: 0 0 0.25rem; font-size: 1.05rem; color: var(--accent); }
    .part-banner p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .part-banner.notes { border-color: #3d5a40; background: #15241a; }
    .part-banner.notes h2 { color: var(--ok); }
    .part-pill { display: inline-block; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 999px; margin-right: 0.4rem; }
    .part-pill.prereq { background: #1e3a55; color: #8ec8f0; }
    .part-pill.notes { background: #1e4030; color: #8fe0b0; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
  </style>
</head>
<body class="mode-all">
  <header>
    <h1>Quiz · Lec 51 Positional Embeddings</h1>
    <p><strong>Two parts:</strong> <em>Part A</em> = <a href="./PREREQUISITES.md">PREREQUISITES.md</a> · <em>Part B</em> = <a href="./NOTES.md">NOTES.md</a>. This video only.</p>
    <p class="hint" style="margin-top:0.5rem">Pick an option → <strong>Check this answer</strong> on that card to see why (per question). Optional: <strong>Score all</strong> for totals.</p>
    <div class="toolbar">
      <div class="mode-toggle">
        <button type="button" id="mode-all" class="active">All at once</button>
        <button type="button" id="mode-wizard">One at a time</button>
      </div>
    </div>
  </header>
  <main>
    <div class="progress" id="progress"></div>
    <div class="score" id="score"></div>
    <div id="questions"></div>
    <div class="actions">
      <button type="button" class="primary" id="submit">Score all answered</button>
      <button type="button" class="secondary" id="reset">Reset all</button>
      <div class="wizard-nav">
        <button type="button" class="secondary" id="prev">← Prev</button>
        <button type="button" class="secondary" id="next">Next →</button>
      </div>
    </div>
  </main>
  <footer>Per-video quiz · check each question · Part A prereqs + Part B notes</footer>
  <script>
    const QUESTIONS = [{"id": "q01", "part": "prerequisites", "anchor": "PREREQUISITES.md#p1", "prompt": "For input sequence tensor X in R^{T x D} and permutation matrix Pi in R^{T x T}, why does unpositioned self-attention satisfy Attn(Pi X) = Pi Attn(X)?", "options": ["Because the softmax function maps any permuted input directly to a uniform probability distribution.", "Because layer normalization removes all off-diagonal row permutations before attention calculation.", "Because the attention weights A = softmax(QK^T / sqrt(d)) satisfy A(Pi X) = Pi A(X) Pi^T, and multiplying by Pi V cancels the permutation transpose Pi^T Pi = I.", "Because the projection matrices W^Q, W^K, W^V are explicitly trained to commute with arbitrary permutation operators."], "answer": "C", "whyCorrect": "Since (Pi Q)(Pi K)^T = Pi (Q K^T) Pi^T, the softmax transforms as Pi A Pi^T. Multiplying by Pi V yields Pi A (Pi^T Pi) V = Pi A V = Pi Z, proving exact permutation equivariance.", "whyOthers": "Option A is mathematically absurd. Option B is false; LayerNorm operates row-wise and preserves row ordering. Option D is false; projection matrices are standard linear maps that do not commute with permutations.", "diagram": "Attn(Pi X) = (Pi A Pi^T)(Pi V) = Pi A (Pi^T Pi) V = Pi (A V) = Pi Attn(X)"}, {"id": "q02", "part": "prerequisites", "anchor": "PREREQUISITES.md#p2", "prompt": "Why does adding a single scalar timestamp t to the first feature channel of embedding x in R^D fail to provide effective positional awareness in high-dimensional models?", "options": ["Adding a scalar to one channel causes immediate floating-point overflow in cuBLAS matrix multiplication.", "In R^D (e.g. D = 512), the single coordinate accounts for only 1/D of feature variance, causing it to be drowned out by the other 511 channels and discarded as negligible noise.", "Scalar addition violates the associative property of vector spaces.", "High-dimensional spaces require all coordinates to be strictly non-zero positive integers."], "answer": "B", "whyCorrect": "In high-dimensional Euclidean spaces, total vector variance is distributed across all D channels. An isolated 1D scalar signal is negligible compared to the total token variance and gets squelched during layer normalization and gradient descent.", "whyOthers": "Option A is false; addition does not cause overflow for moderate sequence lengths. Option C is false; vector addition is always associative. Option D is mathematically false.", "diagram": "Channel 0 variance = 1/D of total variance ==> Treated as microscopic noise by the network"}, {"id": "q03", "part": "prerequisites", "anchor": "PREREQUISITES.md#p3", "prompt": "Given the 2D sinusoidal coordinate vector v_pos = [sin(omega * pos), cos(omega * pos)]^T, what operator transforms v_pos into v_{pos+k} for any fixed offset k?", "options": ["A non-linear feedforward projection layer with ReLU activation.", "A scalar shrinkage factor lambda = exp(-k / 10000).", "A permutation matrix that swaps the sine and cosine coordinates.", "A 2D rotation matrix R(omega * k) belonging to the special orthogonal group SO(2) that acts independently of absolute position pos."], "answer": "D", "whyCorrect": "By trigonometric angle addition identities, [sin(omega(pos+k)); cos(omega(pos+k))] = [[cos(omega*k), sin(omega*k)], [-sin(omega*k), cos(omega*k)]] * [sin(omega*pos); cos(omega*pos)], which is an exact 2D rotation matrix.", "whyOthers": "Option A is incorrect; the transformation is strictly linear and requires no non-linearities. Option B describes exponential decay, not trigonometric rotation. Option C changes values rather than performing continuous rotation.", "diagram": "v_{pos+k} = R(omega * k) * v_{pos} where R(theta) in SO(2)"}, {"id": "q04", "part": "prerequisites", "anchor": "PREREQUISITES.md#p4", "prompt": "In the Vaswani geometric frequency progression omega_i = 10000^{-2i/D}, what is the maximum wavelength lambda_{max} for D = 512, and why is this scale necessary?", "options": ["lambda_{max} = 2 * pi * 10000 ~ 62,832 tokens, ensuring that the slowest channel varies monotonically without repeating across long sequence contexts.", "lambda_{max} = 10000 tokens, exactly matching the vocabulary size of the tokenizer.", "lambda_{max} = 512 tokens, matching the model hidden dimension D.", "lambda_{max} = 2 * pi ~ 6.28 tokens, tracking immediate word bigrams."], "answer": "A", "whyCorrect": "At i = D/2 - 1, omega_min ~ 1/10000, so wavelength lambda = 2*pi / omega = 2*pi * 10000 ~ 62,832 tokens. This guarantees that every position up to tens of thousands of tokens receives an unrepeated coordinate.", "whyOthers": "Option B confuses wavelength with vocabulary size. Option C confuses wavelength with embedding dimension. Option D describes the fastest frequency channel at i = 0.", "diagram": "lambda_{max} = 2*pi / omega_{min} = 2*pi * 10000 ~ 62,832 tokens >> typical context window"}, {"id": "q05", "part": "notes", "flavor": "definition", "anchor": "NOTES.md#topic-2", "prompt": "What is the formal operational definition of a positional embedding function f: N_0 -> R^D in Transformer architectures?", "options": ["A hashing function that maps token strings to integer vocabulary indices.", "A continuous or discrete mapping that assigns each sequence index pos in {0, 1, ..., T-1} a unique D-dimensional coordinate vector to break permutation equivariance.", "A regularization term added to the cross-entropy loss function to penalize long sequences.", "An attention mask that sets all lower-triangular matrix elements to negative infinity."], "answer": "B", "whyCorrect": "A positional embedding function maps discrete temporal indices pos into D-dimensional geometric coordinate vectors p_pos in R^D that are injected into token representations.", "whyOthers": "Option A defines tokenization, not positional embedding. Option C describes length penalties. Option D defines causal autoregressive masking.", "diagram": "f: pos in N_0 |---> PE_{pos} in R^D"}, {"id": "q06", "part": "notes", "flavor": "numerical", "anchor": "NOTES.md#topic-3", "prompt": "For embedding dimension D = 64 and base constant 10000, what is the angular frequency omega_0 of the first pair (i=0) and the angular frequency omega_{16} of the midpoint pair (i=16)?", "options": ["omega_0 = 10000.0, and omega_{16} = 100.0.", "omega_0 = 0.5, and omega_{16} = 0.25.", "omega_0 = 1.0, and omega_{16} = 0.01 (since 10000^{-(2*16)/64} = 10000^{-0.5} = 1/100).", "omega_0 = 0.0, and omega_{16} = 1.0."], "answer": "C", "whyCorrect": "For i = 0, omega_0 = 10000^0 = 1.0. For i = 16, 2i/D = 32/64 = 0.5, so omega_{16} = 10000^{-0.5} = 1 / sqrt(10000) = 1/100 = 0.01.", "whyOthers": "Option A inverts the exponent sign. Option B uses an arithmetic rather than geometric progression. Option D confuses frequencies with angle phases.", "diagram": "omega_i = 10000^{-2i/D} ==> omega_0 = 10000^0 = 1.0; omega_{16} = 10000^{-0.5} = 0.01"}, {"id": "q07", "part": "notes", "flavor": "compare", "anchor": "NOTES.md#topic-4", "prompt": "How does element-wise additive superposition (x_t + PE_t in R^D) compare architecturally to concatenation ([x_t ; PE_t] in R^{2D})?", "options": ["Concatenation requires fewer parameters because it eliminates the need for output projection matrix W^O.", "Addition creates severe irreversible interference between words and positions that prevents the model from converging.", "Concatenation is strictly required whenever multi-head attention uses more than 4 heads.", "Addition conserves model dimension D and avoids doubling parameter counts in projection matrices W^Q, W^K, W^V, relying on high-dimensional almost-orthogonality to avoid semantic crosstalk."], "answer": "D", "whyCorrect": "Addition maintains tensor shape [B, T, D], preserving projection weight dimensions (D x D). High-dimensional geometry guarantees that random semantic vectors and sinusoidal coordinates occupy nearly orthogonal subspaces, preventing interference.", "whyOthers": "Option A is false; concatenation doubles projection parameters from D^2 to 2D^2. Option B is contradicted by the success of Transformers. Option C is completely fabricated.", "diagram": "Addition: [B, T, D] with 3*D^2 params vs Concatenation: [B, T, 2D] with 6*D^2 params (2x explosion)"}, {"id": "q08", "part": "notes", "flavor": "tradeoff", "anchor": "NOTES.md#topic-4", "prompt": "What is the primary operational trade-off of learned positional lookup tables (used in original BERT and GPT-2) compared to continuous sinusoidal or rotary embeddings?", "options": ["Learned tables learn data-specific position biases within the training window but cannot extrapolate to sequence lengths beyond T_{max}, whereas continuous encodings support arbitrary lengths.", "Learned tables extrapolate infinitely while sinusoidal encodings fail if sequence length exceeds 128 tokens.", "Sinusoidal encodings require 10x more GPU memory during inference than learned lookup tables.", "Learned tables are strictly permutation equivariant while sinusoidal encodings are not."], "answer": "A", "whyCorrect": "A learned embedding matrix E_pos has fixed dimension [T_max, D]. If a test prompt has T > T_max, the model crashes with index out-of-bounds. Sinusoidal and rotary encodings are mathematical functions that evaluate at any integer pos in [0, inf).", "whyOthers": "Option B inverts the true capabilities. Option C is false; sinusoidal buffers are computed once with negligible memory. Option D is false; both break permutation equivariance.", "diagram": "Learned Table: Hard boundary at T_{max} vs Sinusoidal/RoPE: Continuous function f(t) for any t"}, {"id": "q09", "part": "notes", "flavor": "connect", "anchor": "NOTES.md#topic-5", "prompt": "How does cross-attention connect representation spaces across neural network modules in sequence-to-sequence architectures?", "options": ["Keys and Values are projected from the target decoder, while Queries are projected from the source encoder.", "Queries Q are projected from the target sequence (decoder), while Keys K and Values V are projected from the source sequence (encoder representations).", "Queries, Keys, and Values are all projected from the decoder representations, while the encoder is bypassed.", "Cross-attention averages all encoder tokens into a single scalar and adds it to the decoder logits."], "answer": "B", "whyCorrect": "In cross-attention, the decoder generates Queries Q = X_dec W^Q to search for relevant information, while the encoder provides contextual Keys K = X_enc W^K and Values V = X_enc W^V.", "whyOthers": "Option A inverts the role of queries and keys. Option C describes decoder self-attention, not cross-attention. Option D describes static pooling.", "diagram": "Decoder: Q = X_dec * W^Q ──┐\n                           ├──► Attn(Q, K, V) = softmax(Q K^T / sqrt(d)) * V\nEncoder: K, V = X_enc * W  ──┘"}, {"id": "q10", "part": "notes", "flavor": "trap", "anchor": "NOTES.md#topic-2", "prompt": "An engineer modifies a Transformer by adding a uniform scalar timestamp t to all feature channels: x_tilde_t = x_t + t * 1. What empirical failure occurs during long-context training?", "options": ["The loss function encounters an immediate division-by-zero error on the first token.", "The self-attention matrix becomes strictly symmetric, forcing all attention weights to 0.5.", "As sequence index t grows, the vector norm ||x_tilde_t|| explodes as O(t * sqrt(D)), causing the positional offset to dominate and completely erase semantic word differences.", "The model's parameter count increases linearly with sequence length t."], "answer": "C", "whyCorrect": "Adding t * 1 causes the norm of tokens to grow proportionally to t * sqrt(D). For t = 500, the positional magnitude completely overwhelms the O(sqrt(D)) semantic embedding norm, causing all words at position 500 to collapse into identical representations.", "whyOthers": "Option A is false; addition does not divide by zero. Option B is false; scores do not become symmetric. Option D is false; addition introduces zero new parameters.", "diagram": "||x_t + t*1||^2 = ||x_t||^2 + t^2*D ==> As t grows, position drowns out semantics completely!"}, {"id": "q11", "part": "notes", "flavor": "map", "anchor": "NOTES.md#topic-1", "prompt": "On the global course architecture map, how do positional embeddings interact with the hypothesis space of self-attention models?", "options": ["They restrict the hypothesis space to linear regression models.", "They convert the non-convex optimization objective into a strictly convex quadratic program.", "They eliminate the requirement for empirical risk minimization by setting Bayes-optimal weights.", "They expand the hypothesis space from permutation-equivariant set functions to the complete class of sequence-ordered functions."], "answer": "D", "whyCorrect": "Unpositioned self-attention can only represent permutation-equivariant functions over multisets. Adding positional coordinates conditions each token on its sequence coordinate, expanding the hypothesis space to model ordered language syntax.", "whyOthers": "Option A is absurd; Transformers remain highly non-linear deep neural networks. Option B is false; deep neural network loss surfaces remain non-convex. Option C is false; models must still be trained via ERM.", "diagram": "Hypothesis Space: H_{equivariant} (Unordered Sets) ──[+ PE]──► H_{sequence} (Syntactic Order)"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
