ralize this with ∩ of two preimages."}, {"id": "q4", "part": "prerequisites", "tag": "Warm-up · multi maps", "anchor": "PREREQUISITES.md#p3-multi-maps", "prompt": "Why can one sample space Ω host two random variables?", "options": [{"key": "A", "text": "Because sets forbid more than one function between them"}, {"key": "B", "text": "Because every RV must invent a brand-new Ω"}, {"key": "C", "text": "Because only densities can be multiple"}, {"key": "D", "text": "Because many functions can share the same domain Ω"}], "answer": "D", "whyCorrect": "Many maps Ω→R are allowed; that is multiple RVs on one experiment.", "whyOthers": {"A": "Sets allow many functions.", "B": "Opposite of the warm-up.", "C": "Not the reason."}, "diagram": "  Ω──X1→R   Ω──X2→R", "useLater": "Topic 3 multi-RV box."}, {"id": "q5", "part": "prerequisites", "tag": "Warm-up · joint preimage", "anchor": "PREREQUISITES.md#p4-joint-preimage", "prompt": "What set does “X1≤a and X2≤b” become on the shared Ω?", "options": [{"key": "A", "text": "The union X1^{-1}((-∞,a]) ∪ X2^{-1}((-∞,b])"}, {"key": "B", "text": "The intersection X1^{-1}((-∞,a]) ∩ X2^{-1}((-∞,b])"}, {"key": "C", "text": "Only the singleton {a,b}"}, {"key": "D", "text": "The empty set always"}], "answer": "B", "whyCorrect": "Both conditions at once = intersection of the two preimages.", "whyOthers": {"A": "Union is “or,” not “and.”", "C": "Not a region of outcomes.", "D": "Usually nonempty."}, "diagram": "  E = pre1 ∩ pre2", "useLater": "Joint definition Topic 4."}, {"id": "q6", "part": "prerequisites", "tag": "Warm-up · vector views", "anchor": "PREREQUISITES.md#p5-vector-vs-scalars", "prompt": "How are “one vector RV X:Ω→R^d” and “d scalar RVs on the same Ω” related in the warm-up?", "options": [{"key": "A", "text": "They are competing incompatible theories"}, {"key": "B", "text": "They are equivalent views of the same structure"}, {"key": "C", "text": "Only the scalar view is ever legal"}, {"key": "D", "text": "Only the vector view can , "useLater": "p(x|y)=joint/marginal for RVs."}, {"id": "q20", "part": "notes", "tag": "Topic 6 · fix y", "anchor": "NOTES.md#topic-6-conditional-probability-and-distributions-1311–1721", "prompt": "When writing a conditional distribution p(x|y), what is true of y?", "options": [{"key": "A", "text": "y is held fixed; the effective sample space shrinks"}, {"key": "B", "text": "y must remain fully random inside the same symbol"}, {"key": "C", "text": "y is deleted from the model forever"}, {"key": "D", "text": "y is always equal to the empty outcome"}], "answer": "A", "whyCorrect": "Conditioner fixed at a value; describe x in that smaller world.", "whyOthers": {"B": "Lecture insists y is fixed.", "C": "Conditioning uses y; does not delete the concept.", "D": "Nonsense."}, "diagram": "  fix y · describe x", "useLater": "Image given disease label."}, {"id": "q21", "part": "notes", "tag": "Topic 7 · marginal", "anchor": "NOTES.md#topic-7-marginals-and-the-x-ray-bridge-1721–2142", "prompt": "How do you obtain a marginal of X from a joint of (X,Y) in the continuous case?", "options": [{"key": "A", "text": "Multiply by a constant density height only"}, {"key": "B", "text": "Delete Ω and keep only Y"}, {"key": "C", "text": "Integrate the joint over the range of Y (nullify Y)"}, {"key": "D", "text": "Always set the joint equal to 1"}], "answer": "C", "whyCorrect": "Integrate (or sum) the other variable out of the joint.", "whyOthers": {"A": "Not the definition.", "B": "Wrong operation.", "D": "Not a marginalization rule."}, "diagram": "  p(x)=∫ p(x,y) dy", "useLater": "Denominator of conditionals."}, {"id": "q22", "part": "notes", "tag": "Connect · joint to conditional", "anchor": "NOTES.md#topic-6-conditional-probability-and-distributions-1311–1721", "prompt": "Which connection does the lecture use between joint, conditional, and marginal?", "options": [{"key": "A", "text": "Conditional = joint / marginal (conditioner), with y fixed"}, {"key": "B", "text": "Conditional = marginal + joint with no division"}, {"key": "C", "text": "Joint is never used once margins exist"}, {"key": "D", "text": "Margins replace Ω permanently"}], "answer": "A", "whyCorrect": "p(x|y)=p(x,y)/p(y) in the continuous write-up.", "whyOthers": {"B": "Missing renormalization.", "C": "Joints stay central.", "D": "Ω remains the foundation."}, "diagram": "  cond = joint / marg", "useLater": "Full toolkit for multi-RV ML."}, {"id": "q23", "part": "notes", "tag": "Topic 7 · bridge", "anchor": "NOTES.md#topic-7-marginals-and-the-x-ray-bridge-1721–2142", "prompt": "What does the lecture stop to promise next after joints/conditionals/margins?", "options": [{"key": "A", "text": "Ground the X-ray disease problem in this language, then densities"}, {"key": "B", "text": "Abandon probability and only use linear algebra forever"}, {"key": "C", "text": "Prove that joints never exist"}, {"key": "D", "text": "Replace all RVs with constant zero"}], "answer": "A", "whyCorrect": "Bridge: X-ray diseased/non-disease grounding, then density functions.", "whyOthers": {"B": "Course continues probability for ML.", "C": "Joints were just defined.", "D": "Nonsense."}, "diagram": "  next: X-ray + densities", "useLater": "Series continuity into density lecture."}, {"id": "q24", "part": "notes", "tag": "Topic 6 · different range dims", "anchor": "NOTES.md#topic-6-conditional-probability-and-distributions-1311–1721", "prompt": "In the lecture, X and Y are RVs on the same Omega, and we form P(X|Y). Must their ranges have the same dimension?", "options": [{"key": "A", "text": "Yes: both must map to the same R^d or conditionals are illegal"}, {"key": "B", "text": "No: one may live in R^d and the other in R^k (e.g. image features vs a low-dim label); they still need a shared Omega"}, {"key": "C", "text": "Ranges must both be empty sets"}, {"key": "D", "text": "Only Y may be vector-valued; X must always be scalar"}], "answer": "B", "whyCorrect": "He explicitly allows different range spaces (R^d vs R^k). The shared object is the sample space Omega, not the dimension of the codomain. That is exactly the ML setup: high-dim image X and low-dim disease label Y.", "whyOthers": {"A": "Same dimension is not required.", "C": "Nonsense.", "D": "Both may be vector-valued; X is often the high-dim one."}, "diagram": "  X:Omega→R^d   Y:Omega→R^k   same Omega", "useLater": "X-ray / disease joint and conditionals."}, {"id": "q25", "part": "notes", "tag": "Topic 6–7 · discrete conditional", "anchor": "NOTES.md#topic-6-conditional-probability-and-distributions-1311–1721", "prompt": "Using the joint table P(X=0,Y=0)=0.1, P(X=0,Y=1)=0.2, P(X=1,Y=0)=0.3, P(X=1,Y=1)=0.4, what is P(X=0 | Y=1)?", "options": [{"key": "A", "text": "0.2"}, {"key": "B", "text": "0.3"}, {"key": "C", "text": "1/3"}, {"key": "D", "text": "0.6"}], "answer": "C", "whyCorrect": "P(Y=1)=0.2+0.4=0.6 (column margin). P(X=0|Y=1)=P(X=0,Y=1)/P(Y=1)=0.2/0.6=1/3. Same shrink-and-renormalize idea as P(A|B); the joint cell is not already the conditional.", "whyOthers": {"A": "That is the joint cell P(X=0,Y=1), before dividing by the marginal.", "B": "That is P(X=0)=0.1+0.2, not the conditional given Y=1.", "D": "That is P(Y=1), the denominator alone."}, "diagram": "  0.2 / 0.6 = 1/3", "useLater": "Conditional = joint / marginal; margins are table edges (Topic 7)."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
