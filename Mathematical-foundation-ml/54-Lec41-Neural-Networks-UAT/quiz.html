  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Prereqs · Affine Transformations", "anchor": "PREREQUISITES.md#p1", "prompt": "Compute the pre-activation vector z = Wx + b given input vector x = [2.0, -1.0]^T, weight matrix W = [[0.5, 1.5], [-2.0, 0.0]], and bias b = [0.2, 1.0]^T. What is z?", "options": [{"key": "A", "text": "z = [0.5, -3.0]^T"}, {"key": "B", "text": "z = [1.2, -4.0]^T"}, {"key": "C", "text": "z = [-0.3, -3.0]^T"}, {"key": "D", "text": "z = [-0.5, -2.0]^T"}], "answer": "C", "whyCorrect": "z_1 = (0.5)(2.0) + (1.5)(-1.0) + 0.2 = 1.0 - 1.5 + 0.2 = -0.3; z_2 = (-2.0)(2.0) + (0.0)(-1.0) + 1.0 = -4.0 + 1.0 = -3.0.", "whyOthers": {"A": "Forgot to subtract 1.5 from (1.5)(-1.0) in the first coordinate.", "B": "Added the coordinates incorrectly instead of taking inner products.", "D": "Omitted the bias vector additions."}, "diagram": "  W @ x + b = [[0.5, 1.5], [-2.0, 0.0]] @ [2, -1]^T + [0.2, 1.0]^T = [-0.3, -3.0]^T", "useLater": "Every fully connected layer evaluates z = Wx + b before applying activation sigma."}, {"id": "q2", "part": "prerequisites", "tag": "Prereqs · Linear Separability", "anchor": "PREREQUISITES.md#p4", "prompt": "Why is the 2-input XOR function a fatal trap that will fail for any single-layer perceptron with a linear threshold?", "options": [{"key": "A", "text": "The XOR function has outputs that are non-binary and continuous."}, {"key": "B", "text": "The convex hulls of the positive class {(0, 1), (1, 0)} and negative class {(0, 0), (1, 1)} intersect at (0.5, 0.5), violating linear separability."}, {"key": "C", "text": "The Perceptron Learning Algorithm only works when the number of input features is greater than 3."}, {"key": "D", "text": "Linear models cannot handle inputs containing zeros."}], "answer": "B", "whyCorrect": "A dataset is linearly separable if and only if the convex hulls of both classes are disjoint. For XOR, both convex hulls contain midpoint (0.5, 0.5), so no hyperplane can separate them.", "whyOthers": {"A": "XOR outputs are strictly binary {0, 1}.", "C": "PLA operates in any dimension d >= 1.", "D": "Linear models process zero-valued inputs without mathematical restriction."}, "diagram": "  (0,1)[+] ------- (1,1)[-]\n     |     (0.5,0.5)  |\n  (0,0)[-] ------- (1,0)[+]", "useLater": "Overcoming this XOR barrier is what motivated the creation of Multi-Layer Perceptrons."}, {"id": "q3", "part": "prerequisites", "tag": "Prereqs · Supremum Norm", "anchor": "PREREQUISITES.md#p5", "prompt": "What is the formal definition of the supremum norm ||f - g||_infinity = sup_{x in X} |f(x) - g(x)|, and what does it measure?", "options": [{"key": "A", "text": "The average squared distance between f and g across the training points."}, {"key": "B", "text": "The angle between the gradient vectors of f and g."}, {"key": "C", "text": "The area under the difference curve between f and g."}, {"key": "D", "text": "The worst-case absolute gap between f(x) and g(x) across any point in domain X."}], "answer": "D", "whyCorrect": "The supremum norm is the uniform distance measuring the single maximum vertical discrepancy anywhere on domain X.", "whyOthers": {"A": "That defines the mean squared error (L2 empirical norm), not the supremum norm.", "B": "That measures directional alignment, not function distance.", "C": "That defines the L1 integral norm integral |f - g| dx."}, "diagram": "  ||f - g||_inf = max_x |f(x) - g(x)| <= epsilon", "useLater": "The Universal Approximation Theorem bounds uniform error using this exact supremum norm."}, {"id": "q4", "part": "prerequisites", "tag": "Prereqs · Complexity", "anchor": "PREREQUISITES.md#p8", "prompt": "How does the Fast Fourier Transform (FFT) differ from a naive Discrete Fourier Transform, and which chain links this to deep networks?", "options": [{"key": "A", "text": "FFT factorizes a monolithic O(N^2) matrix product into log2(N) compositional stages requiring O(N log N) ops, analogous to how deep nets factorize complex functions into hierarchical layers with exponentially fewer parameters."}, {"key": "B", "text": "FFT transforms neural network weights from floating-point numbers into complex numbers to avoid vanishing gradients."}, {"key": "C", "text": "FFT is only used for audio processing and has no conceptual mathematical relationship to neural network depth."}, {"key": "D", "text": "FFT forces all layers in a deep neural network to have exactly N neurons."}], "answer": "A", "whyCorrect": "Both FFT and deep neural networks replace a single massive wide operation with a cascade of sparse composed transformations that reuse intermediate representations.", "whyOthers": {"B": "FFT in this context is an architectural complexity analogy, not complex-valued backprop.", "C": "The lecture explicitly uses the FFT as the core theoretical analogy for deep vs shallow representation efficiency.", "D": "FFT factorizes dimensions logarithmically; it does not force constant layer widths."}, "diagram": "  Dense DFT: O(N^2) ops  vs  FFT Butterfly: O(N log N) ops", "useLater": "Explains why deep & narrow networks crush shallow & wide networks in modern AI."}, {"id": "q5", "part": "notes", "tag": "Lecture · PLA Mechanics", "anchor": "NOTES.md#topic-2-the-biological-perceptron--perceptron-learning-algorithm-pla-05150910", "prompt": "In the Perceptron Learning Algorithm, which chain connects a misclassified sample (x_t, y_t) to the update rule w_{t+1} = w_t + y_t x_t geometrically?", "options": [{"key": "A", "text": "It scales the magnitude of the bias vector to infinity."}, {"key": "B", "text": "It shrinks the margin gamma down to zero."}, {"key": "C", "text": "It physically tilts the normal vector of the separating hyperplane toward the misclassified sample."}, {"key": "D", "text": "It inverts the signs of all input features in the dataset."}], "answer": "C", "whyCorrect": "Adding y_t x_t shifts the normal vector w such that the inner product w_{t+1}^T x_t increases in the direction of the correct sign y_t.", "whyOthers": {"A": "Biases are updated by +y_t, not scaled to infinity.", "B": "The geometric margin is a property of the data distribution, not altered by the algorithm.", "D": "The data points are fixed; only the model weights are adjusted."}, "diagram": "  w_{t+1} = w_t + y_t * x_t  (hyperplane normal rotates)", "useLater": "Contrasts with gradient descent where weights update via continuous loss gradients."}, {"id": "q6", "part": "notes", "tag": "Lecture · MLP Architecture", "anchor": "NOTES.md#topic-3-multi-layer-perceptron-mlp-matrix-formulation-depth--parameter-counting-09101520", "prompt": "How many total trainable parameters (including all biases) must you compute for an MLP with input dimension d = 4, hidden layer 1 width L1 = 5, hidden layer 2 width L2 = 3, and output dimension K = 2?", "options": [{"key": "A", "text": "34 parameters"}, {"key": "B", "text": "51 parameters"}, {"key": "C", "text": "41 parameters"}, {"key": "D", "text": "60 parameters"}], "answer": "B", "whyCorrect": "Layer 1: 5*4 + 5 = 25. Layer 2: 3*5 + 3 = 18. Layer 3: 2*3 + 2 = 8. Total = 25 + 18 + 8 = 51 parameters.", "whyOthers": {"A": "Omitted all bias terms (20 + 15 + 6 = 41 is weights only; 34 is miscalculated).", "C": "41 is the number of weights only, forgetting the 10 bias parameters (5 + 3 + 2).", "D": "Added redundant dimensions across non-adjacent layers."}, "diagram": "  [4] --(5*4+5=25)--> [5] --(3*5+3=18)--> [3] --(2*3+2=8)--> [2]  =>  Sum = 51", "useLater": "Parameter counting is critical for GPU memory estimation and avoiding OOM errors."}, {"id": "q7", "part": "notes", "tag": "Lecture · UAT Theorem", "anchor": "NOTES.md#topic-4-the-universal-approximation-theorem-uat-formal-statement--squashing-activations-15202150", "prompt": "What is the exact set of conditions required by the Universal Approximation Theorem (Cybenko 1989) to guarantee uniform approximation of target function f?", "options": [{"key": "A", "text": "Domain X must be compact in R^d, target f must be continuous on X, and activation sigma must be continuous and sigmoidal (squashing)."}, {"key": "B", "text": "The hidden layer must have fewer neurons than the input dimension d."}, {"key": "C", "text": "The activation function must be an algebraic polynomial of degree >= 3."}, {"key": "D", "text": "The target function f must be linear and the domain X must be infinite."}], "answer": "A", "whyCorrect": "UAT requires a compact domain X subset R^d, continuous target f in C(X), and squashing sigmoidal activation with asymptotic limits 0 and 1.", "whyOthers": {"B": "The hidden layer width N can be arbitrarily large (N >> d).", "C": "Polynomial activations fail UAT because polynomials cannot approximate non-polynomial functions uniformly on compact sets without Runge oscillations.", "D": "The domain must be compact (bounded and closed), and f is continuous non-linear."}, "diagram": "  f in C(X), X subset R^d compact, sigma squashing => sup_{x in X} |f(x) - h(x)| < epsilon", "useLater": "Forms the theoretical bedrock justifying neural networks as universal approximators."}, {"id": "q8", "part": "notes", "tag": "Lecture · UAT Limits", "anchor": "NOTES.md#topic-5-dimensionality-alignment--the-existential-trap-of-uat-21502615", "prompt": "Why is the Universal Approximation Theorem an existential trap where real-world machine learning optimization may fail?", "options": [{"key": "A", "text": "Because neural networks cannot be implemented in software."}, {"key": "B", "text": "Because UAT only applies to single-variable functions where d = 1."}, {"key": "C", "text": "Because the proof was retracted by mathematicians in 1995."}, {"key": "D", "text": "Because UAT only proves that approximating weights exist mathematically, but gives no formula to construct them and zero guarantee that gradient descent will find them from finite data."}], "answer": "D", "whyCorrect": "UAT is non-constructive: it proves mathematical existence, but gradient descent can easily get trapped in local minima or saddle points, and the required width N may be exponentially large.", "whyOthers": {"A": "Neural networks are easily implemented in libraries like PyTorch and NumPy.", "B": "UAT explicitly holds for arbitrary finite dimensions d >= 1.", "C": "UAT is a universally accepted, rigorous theorem in functional analysis."}, "diagram": "  UAT: Existence != Learnability  (Gradient descent is not guaranteed to find W*!)", "useLater": "Directly motivates Empirical Risk Minimization and Backpropagation in Lec 42."}, {"id": "q9", "part": "notes", "tag": "Lecture · Depth vs Width", "anchor": "NOTES.md#topic-6-deep--narrow-vs-shallow--wide-compositional-efficiency--the-fft-analogy-26153042", "prompt": "When evaluating architectural tradeoffs, why should an engineering team prefer a deep & narrow network versus a shallow & wide network?", "options": [{"key": "A", "text": "Because shallow networks cannot be run on modern computers."}, {"key": "B", "text": "Because hierarchical composition allows deep networks to approximate natural compositional functions with exponentially fewer parameters than shallow networks."}, {"key": "C", "text": "Because deep networks have convex optimization landscapes with zero local minima."}, {"key": "D", "text": "Because shallow networks only work with step activations."}], "answer": "B", "whyCorrect": "Depth enables feature reuse across successive layers (like the parity circuit where depth log2(d) cuts gates from 2^d to O(d)), yielding exponential parameter savings.", "whyOthers": {"A": "Shallow networks run fine on computers; they simply require impractically large memory.", "C": "Deep networks have highly non-convex loss surfaces with many local minima and saddle points.", "D": "Shallow networks can use any continuous activation function (as proven by UAT)."}, "diagram": "  Shallow Width: O(2^d)  vs  Deep Composition: O(L * d^2) parameters", "useLater": "Foundation for CNNs (spatial hierarchies) and Transformers (attention hierarchies)."}, {"id": "q10", "part": "notes", "tag": "Master Map · Pipeline", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture", "prompt": "Looking at the master architecture blueprint of this whole lecture, what is the central point of this lecture regarding how neural networks evolve from the single perceptron to deep learning?", "options": [{"key": "A", "text": "The main point is that SVMs are always superior to neural networks for all dataset sizes."}, {"key": "B", "text": "The main point is that activation functions should always be linear to ensure convex loss surfaces."}, {"key": "C", "text": "The lecture shows that while single perceptrons fail on non-linear data, stacking non-linearities grants universal approximation, which is made computationally tractable in practice through deep compositional hierarchy."}, {"key": "D", "text": "The lecture proves that one hidden neuron is always sufficient to solve any classification problem."}], "answer": "C", "whyCorrect": "This captures the entire master worldview arc: Perceptron linear limitation -> UAT universal capacity -> Deep compositional efficiency (FFT analogy).", "whyOthers": {"A": "The lecture explains why neural networks replace SVMs as modern go-to function approximators.", "B": "Linear activations collapse deep networks into single linear models.", "D": "UAT requires N neurons where N can be very large; one neuron is just a single ridge."}, "diagram": "  Perceptron (fails XOR) -> MLP + UAT (Universal) -> Deep Hierarchy (Parameter Efficient)", "useLater": "Unifies the entire Phase 4 progression leading into backpropagation and convolutional inductive biases."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
