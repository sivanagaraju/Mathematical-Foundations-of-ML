ti-dimensional basis expansion yielding a 3D activation tensor."}, {"key": "B", "text": "A single filter violates the Universal Approximation Theorem by making the network non-convex."}, {"key": "C", "text": "PyTorch and CUDA GPUs cannot physically execute layers that contain only one filter."}, {"key": "D", "text": "A single filter forces all output pixels to take negative values."}], "answer": "A", "whyCorrect": "A single filter extracts only one visual feature (e.g. horizontal edge); deploying L filters allows the network to learn L complementary features (edges, textures, color gradients) stacked into a 3D tensor of shape [P_out, Q_out, L].", "whyOthers": {"B": "Neural network empirical risk minimization is non-convex regardless of filter count L.", "C": "Hardware libraries easily support layers with out_channels=1.", "D": "Output activations are determined by inner products and non-linear squashing functions, not filter count."}, "diagram": "L=1 -> 2D slice [P_out x Q_out]  vs  L filters -> 3D tensor [P_out x Q_out x L]", "useLater": "Motivates filter bank hyperparameter tuning in deep vision architectures."}, {"id": "Q7-NOTES-INTER-LAYER-RECURRENCE", "part": "notes", "flavor": "connect", "anchor": "NOTES.md#topic-4-3d-tensor-convolutions-channel-marginalization-and-stride-padding-arithmetic-18002400", "prompt": "In a deep multi-layer CNN, how is the channel depth dimension of filters in layer l determined by the architectural choices made in layer l-1?", "options": [{"key": "A", "text": "The filter depth in layer l must strictly equal the number of filters chosen in layer l-1: R^[l] = L^[l-1]."}, {"key": "B", "text": "The filter depth in layer l must equal the spatial image width P divided by layer depth l."}, {"key": "C", "text": "Filter depth is always fixed at 3 for all layers because input images have RGB channels."}, {"key": "D", "text": "Filter depth in layer l is an unconstrained free hyperparameter that can be chosen arbitrarily."}], "answer": "A", "whyCorrect": "Because layer l-1 produces an activation tensor with L^[l-1] channels, filters in layer l must span all L^[l-1] channels to compute valid 3D inner products and marginalize them.", "whyOthers": {"B": "Spatial width P governs grid dimensions, not channel depth.", "C": "Only layer 1 has filter depth equal to 3 (matching raw RGB inputs); subsequent layers match intermediate channel depths.", "D": "Filter depth is geometrically constrained to match input tensor channel count; choosing an arbitrary depth causes a shape mismatch error."}, "diagram": "Layer l-1: L^[l-1] filters  --->  Tensor A has L^[l-1] channels  --->  Layer l filters: k x k x L^[l-1]", "useLater": "Crucial invariant for building modular deep neural network code without shape mismatches."}, {"id": "Q8-NOTES-SYMMETRY-TRAP", "part": "notes", "flavor": "trap", "anchor": "NOTES.md#topic-5-optimization-dynamics-under-erm-filter-symmetry-breaking-overparameterization-and-bias-variance-24003000", "prompt": "What happens if all L convolutional filters in a layer are initialized with identical constant weights (e.g., all 0.1), and how does deep learning overcome this issue?", "options": [{"key": "A", "text": "All filters produce identical forward activations and receive identical backprop gradients, trapping the network in a degenerate rank-1 symmetric subspace; random initialization breaks symmetry to allow diverse feature learning."}, {"key": "B", "text": "The loss immediately diverges to positive infinity during the first forward pass."}, {"key": "C", "text": "Identical initialization accelerates training by ensuring all filters learn the most optimal edge filter simultaneously."}, {"key": "D", "text": "The optimizer automatically converts the layer into an average pooling layer."}], "answer": "A", "whyCorrect": "Prof. Prathosh explains that ERM offers no guarantee of feature diversity; identical initialization forces identical gradients dL/dW^(1) = dL/dW^(2), requiring stochastic initialization to     function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {

        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
