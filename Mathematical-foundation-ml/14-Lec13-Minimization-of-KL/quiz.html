  <style>

  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · density", "anchor": "PREREQUISITES.md#p1-density", "prompt": "For a continuous random variable, the model likelihood of a data point v_i is best read as:", "options": [{"key": "A", "text": "P(V equals v_i exactly under the model), which is always positive"}, {"key": "B", "text": "The model density p_θ evaluated at v_i (a height, not a point mass)"}, {"key": "C", "text": "The entropy of the true distribution p_V"}, {"key": "D", "text": "The KL divergence D_KL(p_V ‖ p_θ)"}], "answer": "B", "whyCorrect": "In continuous models, likelihood is the density height at the observed point, not P(exact value).", "whyOthers": {"A": "For continuous laws P(exact point)=0; density height is what is evaluated.", "C": "Entropy is a property of a whole distribution, not likelihood of one point.", "D": "KL is a pairwise score, not the likelihood of one sample."}, "diagram": "  continuous: likelihood = p_θ(v_i)  (height)\n  discrete:   often P_θ(V=v_i)       (mass)", "useLater": "Topic 7 renames p_θ(v_i) as likelihood before writing the product L(D)."}, {"id": "q2", "part": "prerequisites", "tag": "Warm-up · argmin", "anchor": "PREREQUISITES.md#p4-argmin", "prompt": "When minimizing f(θ)+c over θ, and c does not depend on θ, the argmin is:", "options": [{"key": "A", "text": "Always θ=0"}, {"key": "B", "text": "Impossible to find without knowing c"}, {"key": "C", "text": "The same as argmin of f(θ) alone"}, {"key": "D", "text": "The same as argmax of f(θ)+c"}], "answer": "C", "whyCorrect": "Adding a θ-independent constant shifts values but not which θ is best.", "whyOthers": {"A": "Nothing forces the minimizer to be zero.", "B": "You can drop c for argmin purposes without knowing its value.", "D": "Argmax of f+c is not the same as argmin of f+c."}, "diagram": "  argmin_θ (f(θ)+c) = argmin_θ f(θ)   if c free of θ", "useLater": "This is why entropy of data is knocked out of the KL objective."}, {"id": "q3", "part": "prerequisites", "tag": "Warm-up · LLN", "anchor": "PREREQUISITES.md#p6-lln", "prompt": "The sample-mean estimator of E_{p_V}[log p_θ(V)] is valid under which data assumption in this lecture?", "options": [{"key": "A", "text": "v_i drawn IID from p_V"}, {"key": "B", "text": "v_i drawn from p_θ only"}, {"key": "C", "text": "v_i must be deterministic constants"}, {"key": "D", "text": "n must equal the dimension d"}], "answer": "A", "whyCorrect": "Weak LLN needs IID draws from the law that defines the expectation — here p_V.", "whyOthers": {"B": "Samples come from truth p_V; the model only supplies log p_θ(·).", "C": "Constants are not random samples from p_V.", "D": "n and d are unrelated requirements for LLN."}, "diagram": "  E[log p_θ(V)]  ≈  (1/n) Σ log p_θ(v_i)\n  need: v_i iid ~ p_V", "useLater": "Topic 5 makes this the trainable objective."}, {"id": "q4", "part": "prerequisites", "tag": "Warm-up · log product", "anchor": "PREREQUISITES.md#p7-log", "prompt": "Why can we maximize Σ log p_θ(v_i) instead of Π p_θ(v_i) for IID likelihood?", "options": [{"key": "A", "text": "Because log always decreases every probability"}, {"key": "B", "text": "Because log is strictly increasing, so argmax is unchanged, and log turns products into sums"}, {"key": "C", "text": "Because Σ log is always larger than the product"}, {"key": "D", "text": "Because KL forbids products"}], "answer": "B", "whyCorrect": "Monotonic log preserves the maximizer; log(ab)=log a+log b converts the joint product into a sum.", "whyOthers": {"A": "Log of a number in (0,1) is negative, but that is not the reason argmax is preserved.", "C": "Comparing magnitudes of sum vs product is irrelevant to shared argmax.", "D": "KL does not ban products; MLE bookkeeping prefers logs."}, "diagram": "  max Π p_θ(v_i)  =  max Σ log p_θ(v_i)   (p_θ>0)", "useLater": "Topic 7 writes L(D)=product then log L=sum."}, {"id": "q5", "part": "prerequisites", "tag": "Warm-up · KL", "anchor": "PREREQUISITES.md#p3-kl", "prompt": "In D_KL(p_V ‖ p_θ), which distribution supplies the expectation weights?", "options": [{"key": "A", "text": "Only p_θ"}, {"key": "B", "text": "A uniform distribution on θ"}, {"key": "C", "text": "The average of p_V and p_θ"}, {"key": "D", "text": "The true data law p_V (first slot)"}], "answer": "D", "whyCorrect": "Forward KL takes expectation under the first argument — the true law.", "whyOthers": {"A": "p_θ appears inside the log ratio, but weights are from p_V.", "B": "θ is a parameter, not a distribution over data.", "C": "KL is not an average of the two laws as weights."}, "diagram": "  D(p_V ‖ p_θ) = E_{p_V}[ log(p_V / p_θ) ]", "useLater": "Forward vs reverse in Topic 6 hinges on this orientation."}, {"id": "q6", "part": "notes", "tag": "Map · whole video definition", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture", "prompt": "Whole-video point: after having KL, the training estimator for θ is obtained by which chain?", "options": [{"key": "A", "text": "Minimize reverse KL, then maximize entropy of p_V from scratch"}, {"key": "B", "text": "Drop E[log p_θ], keep only H(p_V), then sample-average H"}, {"key": "C", "text": "Min forward KL → drop entropy of data → sample-average log p_θ → (same as) MLE"}, {"key": "D", "text": "Replace p_θ by p_V and integrate in closed form without data"}], "answer": "C", "whyCorrect": "That is the master blueprint: min D(p_V‖p_θ), drop H, LLN on E[log p_θ], dual name MLE.", "whyOthers": {"A": "Lecture uses forward KL; entropy of data is not the training target.", "B": "We drop H(p_V) and keep the log-model term, not the reverse.", "D": "Unknown p_V is the problem; data + LLN is the path."}, "diagram": "  min KL → drop H → E[log p_θ] → (1/n)Σ log p_θ ≡ MLE", "useLater": "Every NOTES topic is one box on this chain."}, {"id": "q7", "part": "notes", "tag": "Topic 1 · setup", "anchor": "NOTES.md#topic-1-recipe-return-iid-data-general-v-0003-0305", "prompt": "Why introduce a dummy variable V instead of only writing X or Y?", "options": [{"key": "A", "text": "Because V must always be 1-dimensional"}, {"key": "B", "text": "So the same algebra covers marginals, joints, and conditionals (and super/unsupervised)"}, {"key": "C", "text": "Because KL only works for the letter V"}, {"key": "D", "text": "To avoid using any dataset D"}], "answer": "B", "whyCorrect": "Treatment is general: p_V can mean p_X, p_{X,Y}, conditionals, etc.", "whyOthers": {"A": "v_i live in R^d in general.", "C": "KL does not care about the letter.", "D": "D={v_i} is still the dataset."}, "diagram": "  V ↦ p_X | p_{X,Y} | p_{Y|X} | …\n  same goal: estimate p_V given D", "useLater": "Keeps Topics 2–7 from forking by task type."}, {"id": "q8", "part": "notes", "tag": "Edge · drop entropy trap", "anchor": "NOTES.md#topic-3-drop-entropy-of-data-0505-0640", "prompt": "When minimizing D_KL(p_V ‖ p_θ) over θ, why drop ∫ p_V log p_V?", "options": [{"key": "A", "text": "Because entropy is always zero"}, {"key": "B", "text": "Because it does not depend on θ, so it cannot change the argmin"}, {"key": "C", "text": "Because p_θ does not depend on data"}, {"key": "D", "text": "Because reverse KL forbids entropy"}], "answer": "B", "whyCorrect": "θ is the optimization variable; the entropy-of-data term is constant in θ.", "whyOthers": {"A": "Entropy is generally not zero.", "C": "p_θ is exactly what depends on θ; the dropped term does not involve θ.", "D": "Forward KL expansion is what is used here."}, "diagram": "  KL = [term free of θ] − E[log p_θ]\n         drop for argmin_θ", "useLater": "Leaves max E[log p_θ] as the population training goal."}, {"id": "q9", "part": "notes", "tag": "Topic 4 · obstacle", "anchor": "NOTES.md#topic-4-unknown-p_v-expectation-form-0612-0750", "prompt": "Which pair best states why ∫ p_V log p_θ cannot be computed by brute force?", "options": [{"key": "A", "text": "p_θ is undefined and n must be 1"}, {"key": "B", "text": "Log is undefined for all densities and IID is illegal"}, {"key": "C", "text": "High-d integral is intractable and p_V is unknown (that is the problem)"}, {"key": "D", "text": "KL is always infinite"}], "answer": "C", "whyCorrect": "Lecture names both blockers: R^d intractability and unknown p_V.", "whyOthers": {"A": "p_θ is the model you chose; n is large in practice.", "B": "Log of positive density values is fine; IID is assumed.", "D": "KL need not be infinite for the models considered."}, "diagram": "  blockers:  high-d ∫   +   unknown p_V\n  rewrite:   E[log p_θ] then samples", "useLater": "Motivates LLN sample mean in Topic 5."}, {"id": "q10", "part": "notes", "tag": "Compare · forward vs reverse KL", "anchor": "NOTES.md#topic-6-min-kl-estimator-forward-vs-reverse-lotus-1210-1700", "prompt": "Why does the lecture prefer forward KL D(p_V ‖ p_θ) over reverse D(p_θ ‖ p_V) for this estimator?", "options": [{"key": "A", "text": "Forward KL is always symmetric"}, {"key": "B", "text": "Reverse KL is not a real mathematical object"}, {"key": "C", "text": "Forward is smaller for all models"}, {"key": "D", "text": "Reverse produces terms involving log p_V that you cannot compute; forward yields E_{p_V}[log p_θ] estimable from samples"}], "answer": "D", "whyCorrect": "Computability: samples estimate expectations under p_V of log p_θ; reverse leaves unknown p_V inside badly.", "whyOthers": {"A": "KL is asymmetric in general.", "B": "Reverse KL is real and used elsewhere; just not this recipe’s path.", "C": "Size comparison is not the stated reason."}, "diagram": "  forward: E_{p_V}[log p_θ]  ✓\n  reverse: needs log p_V pieces  ✗", "useLater": "Name: minimum KL estimator uses forward orientation."}, {"id": "q11", "part": "notes", "tag": "Topic 7 · MLE≡min KL", "anchor": "NOTES.md#topic-7-likelihood-mle-equals-min-kl-1700-2451", "prompt": "Under this lecture’s derivation, maximum likelihood estimation and minimum KL estimation:", "options": [{"key": "A", "text": "Are exactly the same estimator (two names / stories)"}, {"key": "B", "text": "Always give opposite parameter values"}, {"key": "C", "text": "Only agree when n=1"}, {"key": "D", "text": "Cannot both involve log p_θ"}], "answer": "A", "whyCorrect": "Product likelihood → log sum is the same objective obtained from min forward KL + LLN.", "whyOthers": {"B": "They coincide, not oppose.", "C": "Equivalence is not limited to n=1.", "D": "Both routes center on log p_θ terms."}, "diagram": "  max Σ log p_θ(v_i)  =  min empirical forward KL path", "useLater": "Slogan: wherever you see MLE, remember min KL estimator."}, {"id": "q12", "part": "notes", "tag": "Connect · T3 to T5", "anchor": "NOTES.md#topic-5-law-of-large-numbers-sample-mean-0742-1210", "prompt": "Which chain correctly links “drop entropy of data” to the finite-sample training loss?", "options": [{"key": "A", "text": "Drop H → maximize E[log p_θ] → approximate E by (1/n)Σ log p_θ(v_i)"}, {"key": "B", "text": "Drop H → minimize Σ p_θ(v_i) without logs"}, {"key": "C", "text": "Drop E[log p_θ] → maximize H from the sample mean of p_V"}, {"key": "D", "text": "Drop IID → integrate p_V in closed form"}], "answer": "A", "whyCorrect": "After dropping H, population goal is max E[log p_θ]; LLN replaces E by the sample mean.", "whyOthers": {"B": "The objective uses log model density, not raw sum of p_θ.", "C": "We keep E[log p_θ], not drop it.", "D": "IID is kept; closed form p_V is unavailable."}, "diagram": "  drop H → max E[log p_θ] → (1/n)Σ log p_θ", "useLater": "That average is also log-likelihood / n."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
