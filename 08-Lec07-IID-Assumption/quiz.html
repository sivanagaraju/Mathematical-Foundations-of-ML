g (only one RV)"}, {"key": "C", "text": "The existence of data"}, {"key": "D", "text": "All of probability"}], "answer": "B", "whyCorrect": "With one RV, multi-RV IID language is not needed the same way.", "whyOthers": {"A": "Ω remains.", "C": "Data are the realizations.", "D": "Nonsense."}, "diagram": "  one RV · n realizations", "useLater": "When full IID phrase is required."}, {"id": "q16", "part": "notes", "tag": "Topic 5 · design", "anchor": "NOTES.md#topic-5-design-choice-of-dataset-test-from-the-same-p-1101–1529", "prompt": "Faces vs buildings: what does the lecture call the choice to treat them as one experiment or two?", "options": [{"key": "A", "text": "A design / packaging choice of the random experiment and dataset"}, {"key": "B", "text": "Impossible by mathematics"}, {"key": "C", "text": "Always mandatory to mix them"}, {"key": "D", "text": "Forbidden once IID is defined"}], "answer": "A", "whyCorrect": "What counts as one RE is design; train faces test buildings breaks identity if not packaged together.", "whyOthers": {"B": "You can package either way.", "C": "Not mandatory.", "D": "IID is assumption on your packaging."}, "diagram": "  design: one RE or two", "useLater": "Dataset construction."}, {"id": "q17", "part": "notes", "tag": "Topic 6 · slogan", "anchor": "NOTES.md#topic-6-labels-vs-one-rv-supervised-names-ml--estimate-p-1529–2103", "prompt": "What is the lecture’s one-line definition of all machine learning?", "options": [{"key": "A", "text": "Given D, estimate P (unknown distribution of the samples)"}, {"key": "B", "text": "Only draw UI mockups"}, {"key": "C", "text": "Ban all random variables"}, {"key": "D", "text": "Set every probability to 1/2"}], "answer": "A", "whyCorrect": "Given D estimate P — rest of course builds estimators.", "whyOthers": {"B": "Not the math definition.", "C": "Opposite.", "D": "Nonsense."}, "diagram": "  D → estimate P", "useLater": "Whole algorithm arc."}, {"id": "q18", "part": "notes", "tag": "Topic 6 · flavors", "anchor": "NOTES.md#topic-6-labels-vs-one-rv-supervised-names-ml--estimate-p-1529–2103", "prompt": "Estimating P(Y|X) with discrete Y is called what in the lecture’s packaging?", "options": [{"key": "A", "text": "Only generative joint sampling"}, {"key": "B", "text": "A classification problem (classifier)"}, {"key": "C", "text": "Deleting X"}, {"key": "D", "text": "Always regression in R^k"}], "answer": "B", "whyCorrect": "P(Y|X) with discrete Y → classification; continuous Y → regression.", "whyOthers": {"A": "Joint P_{X,Y} / sampling is generative packaging.", "C": "Nonsense.", "D": "Regression when Y in R^k."}, "diagram": "  P(Y|X) discrete → classification", "useLater": "Problem naming."}, {"id": "q19", "part": "notes", "tag": "Topic 6 · inpainting", "anchor": "NOTES.md#topic-6-labels-vs-one-rv-supervised-names-ml--estimate-p-1529–2103", "prompt": "In the inpainting example, what plays the role of the label?", "options": [{"key": "A", "text": "The missing / masked pixels to reconstruct"}, {"key": "B", "text": "The empty sample space only"}, {"key": "C", "text": "The learning rate"}, {"key": "D", "text": "A separate hospital name always"}], "answer": "A", "whyCorrect": "Self-supervised: dimensions of data act as label via masking.", "whyOthers": {"B": "Not the example.", "C": "Optimizer detail.", "D": "Not required."}, "diagram": "  mask pixels → reconstruct", "useLater": "Self-supervised packaging."}, {"id": "q20", "part": "notes", "tag": "Topic 7 · formal", "anchor": "NOTES.md#topic-7-labels-synthetic-qa-recap-formal-ml-problem-2103–3041", "prompt": "In the formal board statement, why write P_X rather than always P_{X,Y}?", "options": [{"key": "A", "text": "Because labels never exist"}, {"key": "B", "text": "Because Y can be folded into a bigger X; packaging is flexible"}, {"key": "C", "text": "Because P is always discrete only"}, {"key": "D", "text": "Because sampling is forbidden"}], "answer": "B", "whyCorrect": "He notes Y can be combined into X; still estimate the unknown law of the data object.", "whyOthers": {"A": "Labels are optional packaging.", "C": "Not the reason.", "D": "Generative may learn sampling."}, "diagram": "  Y foldable into X", "useLater": "Unified estimation view."}, {"id": "q21", "part": "notes", "tag": "Connect · axes to ML", "anchor": "NOTES.md#topic-3-independence-across-points-not-dimensions-0422–0736", "prompt": "Which connection links the independence-axes topic to estimating P from a dataset?", "options": [{"key": "A", "text": "We factor the joint over n points (product) while still allowing rich dependence inside each point’s features"}, {"key": "B", "text": "We force every feature independent so P is always uniform"}, {"key": "C", "text": "We never use products of any kind"}, {"key": "D", "text": "We delete all but one pixel forever"}], "answer": "A", "whyCorrect": "IID product is over observations; within-point structure remains modelable.", "whyOthers": {"B": "Extra assumption, not default IID.", "C": "Independence is product.", "D": "Nonsense."}, "diagram": "  ∏_i p(zi) · structure inside zi", "useLater": "Likelihood of whole datasets."}, {"id": "q22", "part": "notes", "tag": "Topic 4 · identical redundant", "anchor": "NOTES.md#topic-4-two-viewpoints-sampling-and-when-iid-language-applies-0736–1101", "prompt": "If you package the dataset as n realizations of a single random variable, why does 'identically distributed' become redundant?", "options": [{"key": "A", "text": "Because there is only one RV, so multi-RV 'same distribution as each other' talk is automatic packaging, not a second claim between many RVs"}, {"key": "B", "text": "Because all probabilities become zero"}, {"key": "C", "text": "Because independence forces all values equal"}, {"key": "D", "text": "Because sampling is forbidden in that view"}], "answer": "A", "whyCorrect": "With one RV and n trials, you do not need to say the RV is identically distributed with other RVs — there is only one. Full IID language (identical + independent between RVs) lives naturally in the multi-RV view: one realization of n RVs sharing P and independent.", "whyOthers": {"B": "Nonsense.", "C": "Independence is not equality of values.", "D": "Sampling is exactly multiple trials of that one RE/RV."}, "diagram": "  one RV · n trials → identity automatic", "useLater": "When textbooks write multi-RV product form."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
