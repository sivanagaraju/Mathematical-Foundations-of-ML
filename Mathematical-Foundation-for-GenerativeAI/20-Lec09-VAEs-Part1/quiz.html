  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Warm-up · Jensen's Inequality", "anchor": "PREREQUISITES.md#p3-jensens-inequality", "prompt": "If a positive random variable U takes values u1 = 1.0 and u2 = 9.0 with equal probability (p = 0.5), what is the relationship between log(E[U]) and E[log U]?", "options": [{"key": "A", "text": "log(E[U]) = 1.0986 and E[log U] = 1.6094, violating Jensen's inequality because 1.0986 < 1.6094."}, {"key": "B", "text": "log(E[U]) = 1.6094 and E[log U] = 1.0986, satisfying Jensen's inequality with a positive gap of 0.5108."}, {"key": "C", "text": "log(E[U]) = E[log U] = 1.3540 because the probability weights are symmetrically distributed."}, {"key": "D", "text": "log(E[U]) is undefined because the logarithm of an expectation does not exist for discrete variables."}], "answer": "B", "whyCorrect": "E[U] = 0.5(1) + 0.5(9) = 5.0, so log(E[U]) = log(5.0) ≈ 1.6094. Meanwhile, E[log U] = 0.5*log(1) + 0.5*log(9) = 0 + 0.5*(2.1972) ≈ 1.0986. Because log is strictly concave, the curved arch sits above the chord: log(E[U]) >= E[log U].", "whyOthers": {"A": "This inverts the values; the log of the average (1.6094) is strictly larger than the average of the logs (1.0986).", "C": "Equality holds if and only if the random variable is constant (zero variance); here Var(U) = 16 > 0.", "D": "The logarithm of any positive real scalar is well-defined; E[U] = 5.0 is positive."}, "diagram": "  y = log(u) : Arch log(E[u])=1.6094  >  Chord E[log u]=1.0986 (Gap = 0.51)", "useLater": "This concavity inequality creates the Evidence Lower Bound floor: log p(x) >= ELBO."}, {"id": "q2", "part": "prerequisites", "tag": "Warm-up · Marginal Likelihood", "anchor": "PREREQUISITES.md#p1-joint-marginal-conditional", "prompt": "What is the formal definition of the marginal data likelihood p_theta(x) in a continuous latent variable model, and why is it called the evidence?", "options": [{"key": "A", "text": "It is the conditional decoder distribution p_theta(x | z) evaluated at the mean latent vector z = 0."}, {"key": "B", "text": "It is the derivative of the data entropy with respect to the continuous latent space coordinates."}, {"key": "C", "text": "It is the integral of the joint density over all possible latent configurations: p_theta(x) = ∫ p_theta(x, z) dz = ∫ p_theta(x | z) p(z) dz."}, {"key": "D", "text": "It is the ratio between the encoder variance and the decoder reconstruction loss."}], "answer": "C", "whyCorrect": "Marginal likelihood integrates out the unobserved latent variable z from the joint distribution p_theta(x, z) across R^k, accumulating total probability assigned by the model to observing data point x.", "whyOthers": {"A": "Evaluating at z=0 is a single slice, not the marginal integral over all possible latent configurations.", "B": "Marginal likelihood is a probability density, not the derivative of entropy.", "D": "This confuses an architectural ratio with the fundamental marginalization integral."}, "diagram": "  Joint Space p(x, z) ───[ Integrate out z across R^k ]───► Marginal p(x)", "useLater": "The intractability of this integral forces us to construct the ELBO proxy."}, {"id": "q3", "part": "prerequisites", "tag": "Warm-up · KL Divergence", "anchor": "PREREQUISITES.md#p4-kl-divergence", "prompt": "If an encoder predicts latent parameters mu = 0 and sigma -> 0 (a deterministic delta spike), what does Gibbs' inequality and the Gaussian KL divergence formula guarantee about D_KL(q_phi || p)?", "options": [{"key": "A", "text": "The KL divergence diverges to +infinity because log(sigma^2) -> -infinity, severely penalizing the collapse of stochastic variance."}, {"key": "B", "text": "The KL divergence evaluates to exactly zero because the mean matches the standard prior mean mu = 0."}, {"key": "C", "text": "The KL divergence becomes negative (-1.0), indicating that the encoder has achieved perfect zero entropy."}, {"key": "D", "text": "The KL divergence remains finite and constant at 0.5 because the prior variance is 1.0."}], "answer": "A", "whyCorrect": "The Gaussian KL formula is -0.5 * (1 + log(sigma^2) - mu^2 - sigma^2). As sigma -> 0, log(sigma^2) -> -infinity, driving the -0.5 * log(sigma^2) term to +infinity and preventing deterministic collapse.", "whyOthers": {"B": "Having mu=0 satisfies the mean penalty, but the variance penalty diverges to infinity.", "C": "By Gibbs' inequality, KL divergence is strictly non-negative; it can never be negative.", "D": "The divergence is unbounded as variance shrinks to zero."}, "diagram": "  D_KL = -0.5 * [ 1 + log(σ²) - μ² - σ² ] ──(σ -> 0)──► +∞ (Variance Collapse Penalty)", "useLater": "This property forces the VAE encoder to maintain continuous stochastic coverage across the latent space."}, {"id": "q4", "part": "prerequisites", "tag": "Warm-up · LOTUS", "anchor": "PREREQUISITES.md#p7-lotus-coordinate-transforms", "prompt": "How does the Law of the Unconscious Statistician (LOTUS) simplify computing the expected value of a transformed random variable z = g(epsilon)?", "options": [{"key": "A", "text": "It proves that any non-linear function g(epsilon) can be replaced by its first-order linear Taylor expansion."}, {"key": "B", "text": "It guarantees that the variance of z is always equal to the variance of epsilon multiplied by the Jacobian determinant."}, {"key": "C", "text": "It requires solving the inverse transformation g^(-1)(z) and deriving the explicit probability density function p_Z(z) before integrating."}, {"key": "D", "text": "It computes E[f(z)] directly as E_epsilon[f(g(epsilon))] by integrating against the known base density p(epsilon), without needing to derive the density p_Z(z)."}], "answer": "D", "whyCorrect": "LOTUS proves E_z[f(z)] = ∫ f(g(epsilon)) p(epsilon) d_epsilon. We integrate against the base noise distribution directly, entirely bypassing the need to compute the complicated transformed density of z.", "whyOthers": {"A": "LOTUS is an exact probability theorem holding for all measurable functions, not a linear Taylor approximation.", "B": "LOTUS computes expected values of arbitrary functions, not merely variance scaling.", "C": "The entire power of LOTUS is that you do NOT need to derive the transformed density p_Z(z)."}, "diagram": "  E_{z ~ q}[ f(z) ]  === LOTUS ===>  E_{ε ~ p}[ f( g(ε) ) ]", "useLater": "LOTUS enables the reparameterization trick by shifting parameters from the distribution measure into g."}, {"id": "q5", "part": "notes", "tag": "Master Map · Core Video Thesis", "anchor": "NOTES.md#executive-summary-architecture-of-this-lecture", "prompt": "What is the central architectural dilemma of Lecture 09, and what is the master solution established on the chalkboard?", "options": [{"key": "A", "text": "The dilemma is that neural decoders cannot output continuous pixel values; the solution is quantizing all data into discrete binary tokens."}, {"key": "B", "text": "The dilemma is that differentiating an expectation whose sampling measure depends on encoder weights phi breaks backprop; the solution is the reparameterization trick via LOTUS."}, {"key": "C", "text": "The dilemma is that GAN discriminators suffer from vanishing gradients; the solution is replacing JS divergence with the Wasserstein Earth Mover's distance."}, {"key": "D", "text": "The dilemma is that the KL divergence between two Gaussians has no closed-form formula; the solution is Monte Carlo numerical integration."}], "answer": "B", "whyCorrect": "The central crisis of the lecture is the non-triviality of ∇_phi E_{q_phi}[log p_theta(x|z)]. The reparameterization trick shifts parameter dependence from the distribution measure into a deterministic coordinate mapping z = mu + sigma * eps, unlocking end-to-end backprop.", "whyOthers": {"A": "Decoders routinely output continuous Gaussian means; quantization is VQ-VAE, not the core problem of Lec 09.", "C": "Wasserstein GAN was covered in Lecture 18; this lecture is dedicated to Variational Autoencoders.", "D": "The Gaussian KL divergence has an exact, elementary closed-form algebraic formula."}, "diagram": "  Problem: ∇_φ E_{q_φ}[f(z)] (Measure depends on φ) ──► Solution: z = μ_φ + σ_φ ⊙ ε (LOTUS)", "useLater": "This master insight underpins the entire VAE and diffusion model architectures."}, {"id": "q6", "part": "notes", "tag": "Taxonomy · Deterministic vs Probabilistic", "anchor": "NOTES.md#topic-3-deterministic-vs-probabilistic-neural-representations-of-distributions-06170838", "prompt": "In Prof. Prathosh's taxonomy, how does a deterministic neural representation (such as a GAN generator) differ fundamentally from a probabilistic neural representation (such as a VAE)?", "options": [{"key": "A", "text": "Deterministic networks use ReLU activations, whereas probabilistic networks can only use Sigmoid activations."}, {"key": "B", "text": "Deterministic representations output the analytical parameter vector (mu, sigma^2), whereas probabilistic representations output raw sample pixels."}, {"key": "C", "text": "Deterministic representations output direct sample realizations without assuming a distribution family, whereas probabilistic representations output distribution parameters under an assumed family."}, {"key": "D", "text": "Deterministic representations are convex, whereas probabilistic representations are always strictly non-convex."}], "answer": "C", "whyCorrect": "A GAN generator deterministically maps noise to sample pixels (implicit sampler, no parametric density formula). A VAE encoder outputs distribution parameters (mu, sigma^2) under an explicit parametric assumption (e.g. Gaussian).", "whyOthers": {"A": "Activation functions are independent of whether a network represents samples or parameters.", "B": "This reverses the definitions; GANs output samples, VAEs output parameters.", "D": "Deep neural networks are non-convex regardless of whether their outputs are samples or parameters."}, "diagram": "  Deterministic (GAN): Noise ──► Sample x_hat  |  Probabilistic (VAE): Input x ──► (μ_φ, σ²_φ)", "useLater": "This distinction determines why VAEs can evaluate exact lower bounds while GANs cannot."}, {"id": "q7", "part": "notes", "tag": "ELBO Gradients · Decomposition", "anchor": "NOTES.md#topic-5-gradient-decomposition-of-the-elbo-isolating-the-backpropagation-bottleneck-11541445", "prompt": "When decomposing the ELBO gradients into four terms across parameters theta and phi, which term is identically zero and which term is the non-trivial bottleneck?", "options": [{"key": "A", "text": "∇_phi D_KL is identically zero, and ∇_theta E_q[log p_theta] is the non-trivial bottleneck."}, {"key": "B", "text": "∇_theta E_q[log p_theta] is identically zero, and ∇_theta D_KL is the non-trivial bottleneck."}, {"key": "C", "text": "All four terms are non-trivial and require numerical quadrature grid approximations."}, {"key": "D", "text": "∇_theta D_KL is identically zero (prior has no theta), and ∇_phi E_{q_phi}[log p_theta(x|z)] is the non-trivial bottleneck."}], "answer": "D", "whyCorrect": "The prior p(z) ~ N(0, I) contains no decoder weights theta, so ∇_theta D_KL = 0. The bottleneck is ∇_phi E_{q_phi}[log p_theta] because the differentiation target phi indexes the sampling measure.", "whyOthers": {"A": "∇_phi D_KL is non-zero (it regularizes encoder parameters mu and sigma).", "B": "∇_theta E_q[log p_theta] is the non-zero reconstruction gradient driving decoder training.", "C": "Three of the four terms are straightforward; only one term is a non-trivial bottleneck."}, "diagram": "  ∇_θ D_KL = 0 (Prior has no θ)  |  ★ Bottleneck: ∇_φ E_{q_φ}[ log p_θ(x|z) ]", "useLater": "Isolating this single bottleneck allows targeted resolution via reparameterization."}, {"id": "q8", "part": "notes", "tag": "Calculus · Product Rule Failure", "anchor": "NOTES.md#topic-6-product-rule-anatomy-and-the-failure-of-naive-expectation-gradients-14451810", "prompt": "When expanding ∇_phi ∫ q_phi(z) f(z) dz using the product rule of calculus, why can the surviving term ∫ f(z) ∇_phi q_phi(z) dz NOT be evaluated via Monte Carlo sampling?", "options": [{"key": "A", "text": "Because ∇_phi q_phi(z) is not a probability density: it integrates to zero and takes negative values, violating Kolmogorov's axioms."}, {"key": "B", "text": "Because the function f(z) contains imaginary numbers that cancel out real sample averages."}, {"key": "C", "text": "Because the product rule of calculus only applies to polynomials, not probability distributions."}, {"key": "D", "text": "Because the Leibniz rule prohibits pushing gradients inside continuous integrals."}], "answer": "A", "whyCorrect": "Since ∫ q_phi(z) dz = 1 for all phi, differentiating both sides gives ∫ ∇_phi q_phi(z) dz = 0. A function that integrates to zero and takes negative values is not a valid probability density and cannot be sampled.", "whyOthers": {"B": "All likelihoods and feature functions in VAEs are strictly real-valued.", "C": "The product rule is a universal theorem of calculus holding for all differentiable functions.", "D": "The Leibniz rule explicitly permits exchanging differentiation and integration under mild regularity conditions."}, "diagram": "  ∫ ∇_φ q_φ(z) dz = ∇_φ (1) = 0  ──► Cannot sample from a function that sums to zero!", "useLater": "This mathematical proof refutes the colloquial misconception that sampling is purely a coding error."}, {"id": "q9", "part": "notes", "tag": "Trade-offs · Variance Comparison", "anchor": "NOTES.md#topic-7-the-reparameterization-trick-via-the-law-of-the-unconscious-statistician-lotus-18102202", "prompt": "Why is the pathwise reparameterization gradient estimator preferred over the score-function (REINFORCE) estimator in continuous deep generative models?", "options": [{"key": "A", "text": "The score-function estimator is biased, whereas the pathwise estimator is asymptotically unbiased."}, {"key": "B", "text": "The pathwise estimator works directly on discrete text tokens, whereas the score function fails on discrete variables."}, {"key": "C", "text": "Both are unbiased, but the pathwise estimator exploits the derivative of the decoder ∇_z f(z), reducing gradient variance by over 50x compared to black-box score updates."}, {"key": "D", "text": "The score-function estimator requires inverting a full Hessian matrix at every training step."}], "answer": "C", "whyCorrect": "Both estimators are mathematically unbiased. However, REINFORCE treats f(z) as a scalar reward with variance scaling as ||f(z)||^2. The pathwise estimator differentiates through f(z) directly, yielding vastly lower variance that allows stable training with a single sample (L=1).", "whyOthers": {"A": "Both estimators are strictly unbiased in mathematical expectation.", "B": "Pathwise reparameterization fails on discrete tokens; REINFORCE is standardly used for discrete RL.", "D": "The score function requires only first-order gradients, not Hessian inversion."}, "diagram": "  Variance: Pathwise (Var ≈ 4.0)  vs  Score-Function (Var > 200.0)  ──► 50x Stability Advantage", "useLater": "This low-variance property enables mini-batch SGD convergence in production VAEs."}, {"id": "q10", "part": "notes", "tag": "Architecture · Output Dimension & Sampling", "anchor": "NOTES.md#topic-8-instantiating-reparameterization-gaussian-affine-transforms-inverse-cdfs-and-beyond-22023256", "prompt": "For a latent space of dimension k = 128, how many output neurons does the encoder need for an unconstrained full covariance matrix versus a diagonal covariance matrix?", "options": [{"key": "A", "text": "128 neurons for full covariance versus 64 neurons for diagonal covariance."}, {"key": "B", "text": "16,512 neurons (k + k^2 = 128 + 16,384) for full covariance versus 256 neurons (2k = 128 + 128) for diagonal covariance."}, {"key": "C", "text": "Full covariance requires zero extra neurons because covariance is computed purely from dataset statistics."}, {"key": "D", "text": "Both full and diagonal covariance require exactly 128 output neurons."}], "answer": "B", "whyCorrect": "An unconstrained covariance has k^2 entries (16,384), plus k mean entries = 16,512 neurons. Restricting to diagonal covariance requires only k mean and k log-variance entries = 2k = 256 neurons, yielding massive memory and computational savings.", "whyOthers": {"A": "128 neurons is only enough for the mean alone, leaving zero capacity for variance.", "C": "In amortized variational inference, the encoder neural network must predict sample-dependent covariance parameters.", "D": "Covariance requires predicting uncertainty parameters in addition to the mean vector."}, "diagram": "  Output Neurons: Full Covariance (k + k² = 16,512)  vs  Diagonal Covariance (2k = 256)", "useLater": "This linear scaling O(k) makes diagonal Gaussian VAEs computationally tractable in deep vision backbones."}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };

        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
