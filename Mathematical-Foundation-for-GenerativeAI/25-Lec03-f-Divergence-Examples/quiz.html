<head>

  <style>
    :root {

    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }

    header p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 52rem; }
    header a { color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; align-items: center; }
    .mode-toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 0.45rem 0.9rem; cursor: pointer; font: inherit; }
    .mode-toggle button.active { background: var(--accent); color: #0b1220; font-weight: 600; }
    main { padding: 1.25rem 1.5rem 3rem; max-width: 52rem; margin: 0 auto; }

    .qcard h2 { margin: 0 0 0.35rem; font-size: 1.02rem; font-weight: 650; }
    .qmeta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .opts { display: flex; flex-direction: column; gap: 0.45rem; }
    .opt { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: #1e3348; box-shadow: inset 0 0 0 1px var(--accent); }
    .opt input { margin-top: 0.25rem; accent-color: var(--accent); }

    .opt.reveal-wrong-picked { border-color: var(--bad); background: #3a1f24; }

    .q-actions .check-btn { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    .q-actions .check-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .q-actions .clear-btn { background: var(--panel2); color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.25rem 0; position: sticky; bottom: 0; padding: 0.75rem 0; background: linear-gradient(transparent, var(--bg) 30%); }
    button.primary, button.secondary { font: inherit; border-radius: 8px; padding: 0.65rem 1.1rem; cursor: pointer; border: 1px solid var(--border); }
    button.primary { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--text); }
    .score { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.25rem; }
    .score.show { display: block; }
    .explain { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .explain.show { display: block; }
    .explain h3 { margin: 0.75rem 0 0.4rem; font-size: 0.92rem; color: var(--warn); }
    .verdict { font-weight: 650; margin-bottom: 0.5rem; }
    .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--muted); }
    .why { background: #121a24; border-radius: 8px; padding: 0.75rem 0.9rem; margin: 0.45rem 0; font-size: 0.92rem; }
    .why .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 0.25rem; }
    pre.diagram { font-family: var(--mono); font-size: 0.76rem; line-height: 1.35; background: #0b1018; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; overflow-x: auto; color: #c5d4e8; margin: 0.55rem 0; white-space: pre; }
    .later { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .wizard-nav { display: none; gap: 0.5rem; }
    body.mode-wizard .wizard-nav { display: flex; }
    body.mode-wizard .qcard { display: none; }
    body.mode-wizard .qcard.active { display: block; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 1rem 2rem; }
    .part-banner { margin: 1.25rem 0 0.75rem; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: #152032; }
    .part-banner h2 { margin: 0 0 0.25rem; font-size: 1.05rem; color: var(--accent); }
    .part-banner p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .part-banner.notes { border-color: #3d5a40; background: #15241a; }
    .part-banner.notes h2 { color: var(--ok); }
    .part-pill { display: inline-block; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 999px; margin-right: 0.4rem; }
    .part-pill.prereq { background: #1e3a55; color: #8ec8f0; }
    .part-pill.notes { background: #1e4030; color: #8fe0b0; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
  </style>

<body class="mode-all">
  <header>

    <p><strong>Two parts:</strong> <em>Part A</em> = <a href="./PREREQUISITES.md">PREREQUISITES.md</a> · <em>Part B</em> = <a href="./NOTES.md">NOTES.md</a>. This video only.</p>
    <p class="hint" style="margin-top:0.5rem">Pick an option → <strong>Check this answer</strong> on that card to see why (per question). Optional: <strong>Score all</strong> for totals.</p>
    <div class="toolbar">

    <div id="questions"></div>
    <div class="actions">
      <button type="button" class="primary" id="submit">Score all answered</button>

      <div class="wizard-nav">

      </div>
    </div>
  </main>
  <footer>Per-video quiz · check each question · Part A prereqs + Part B notes</footer>
  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · density", "prompt": "A density p evaluated at one point x is", "options": [{"key": "A", "text": "Always a number in [0,1], the probability of that exact x"}, {"key": "B", "text": "A non-negative height; the probability of a region is an area under p"}, {"key": "C", "text": "The same object as the dataset D"}, {"key": "D", "text": "Required to integrate to 0"}], "answer": "B", "whyCorrect": "Heights can exceed 1. Probability lives on regions, not on a single continuous x.", "whyOthers": {"A": "That confuses density with a PMF / probability.", "C": "D is a pile of samples.", "D": "A density integrates to 1 over the whole space."}, "diagram": "  height p(x)=2 on [0,0.5] is legal\n  P(region)=area, not the height", "useLater": "Topic 8: domain of f is R+ because heights are positive reals.", "anchor": "PREREQUISITES.md#p1-density"}, {"id": "q2", "part": "prerequisites", "tag": "Compare · divergence", "prompt": "Why does he refuse to call f-divergence a distance metric?", "options": [{"key": "A", "text": "It can be negative"}, {"key": "B", "text": "It is only defined for Gaussians"}, {"key": "C", "text": "It need not obey the triangle inequality (and KL is not even symmetric)"}, {"key": "D", "text": "It is always zero"}], "answer": "C", "whyCorrect": "A metric needs triangle (and usually symmetry). D_f keeps ≥0 and =0 iff equal, and drops the rest.", "whyOthers": {"A": "Homework: D_f ≥ 0.", "B": "Any pair of densities.", "D": "Zero only when the hills match."}, "diagram": "  metric: ≥0, =0 iff same, symmetric, triangle\n  D_f: first two, not the last two", "useLater": "Topic 8–9.", "anchor": "PREREQUISITES.md#p6-div-vs-metric"}, {"id": "q3", "part": "prerequisites", "tag": "Worked · convex", "prompt": "f is allowed as an f-divergence generator only if (among other things)", "options": [{"key": "A", "text": "f is convex, left semi-continuous, and f(1)=0"}, {"key": "B", "text": "f(u)=u for all u"}, {"key": "C", "text": "f maps into [0,1]"}, {"key": "D", "text": "f is a metric"}], "answer": "A", "whyCorrect": "Those three are the board conditions. Any such f gives one legal D_f.", "whyOthers": {"B": "Linear f with f(1)=0 is the zero divergence — useless.", "C": "f may return any real.", "D": "f is a function on ratios, not a metric on points."}, "diagram": "  cup that hits 0 at u=1", "useLater": "Topic 8 definition.", "anchor": "PREREQUISITES.md#p4-convex"}, {"id": "q4", "part": "prerequisites", "tag": "Worked · pushforward", "prompt": "Z is uniform on a short interval and G is continuous and onto. The output law", "options": [{"key": "A", "text": "Can have arbitrarily large support"}, {"key": "B", "text": "Equals N(0,I) automatically"}, {"key": "C", "text": "Is always discrete"}, {"key": "D", "text": "Cannot grow past a bounded support — that is why people start Z as Gaussian"}], "answer": "D", "whyCorrect": "A continuous onto map cannot invent mass outside a bounded input support. Infinite-support Z is insurance.", "whyOthers": {"A": "The student question he answers with no.", "B": "Output law depends on G.", "C": "No."}, "diagram": "  short dough ──X──► long noodle", "useLater": "Topic 7.", "anchor": "PREREQUISITES.md#p7-push"}, {"id": "q5", "part": "prerequisites", "tag": "Compare · two sins", "prompt": "High p_x and low p_θ at a point is the sin of", "options": [{"key": "A", "text": "Inventing junk"}, {"key": "B", "text": "A metric triangle"}, {"key": "C", "text": "Missing a real mode (not generating what you should)"}, {"key": "D", "text": "Using a script P"}], "answer": "C", "whyCorrect": "Data hill tall, model hill short: the model skips a place the data lives. Forward KL fines this.", "whyOthers": {"A": "Junk is low p_x, high p_θ.", "B": "Unrelated.", "D": "Notation only."}, "diagram": "  data tall, model short → missed mode\n  data short, model tall → junk", "useLater": "Topic 10.", "anchor": "PREREQUISITES.md#p8-modes"}, {"id": "q6", "part": "notes", "tag": "Map · whole lecture", "prompt": "On the master map, this lecture’s system is", "options": [{"key": "A", "text": "A CNN trainer with a head swap"}, {"key": "B", "text": "Sign-censored Normal MLE plus EM for two exponentials"}, {"key": "C", "text": "A variational proof that D_f equals a dual over discriminators"}, {"key": "D", "text": "Two jobs (estimate + sample) → model p_θ → f-divergence (not a metric) → Z through G_θ; STOP before estimating D from samples"}], "answer": "D", "whyCorrect": "Recipe + f-family + generator cartoon. Variational estimation is explicitly next class.", "whyOthers": {"A": "Tutorial 6.", "B": "Tutorial 10.", "C": "That is the STOP / next lecture."}, "diagram": "  D ~ p_x\n   → p_θ\n   → D_f\n   → Z→G_θ\n   STOP: sample estimate of D_f", "useLater": "Every topic is a box on that blueprint.", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture"}, {"id": "q7", "part": "notes", "tag": "Definition · two jobs", "prompt": "Generative modeling, as he states it, adds which burden to ordinary distribution estimation?", "options": [{"key": "A", "text": "Learn to sample from the unknown law, not only estimate it"}, {"key": "B", "text": "Estimate only the mean of p_x"}, {"key": "C", "text": "Train a CNN from scratch every time"}, {"key": "D", "text": "Drop the IID assumption"}], "answer": "A", "whyCorrect": "Job 1 estimate p_x; job 2 repeat the experiment / draw new range points.", "whyOthers": {"B": "The whole law, not a mean.", "C": "Architecture-agnostic course.", "D": "He keeps IID samples."}, "diagram": "  D ~iid p_x  →  estimate AND sample", "useLater": "Topic 5: sampling = Z through G_θ*.", "anchor": "NOTES.md#topic-1-two-jobs-estimate-and-sample-0002–0316"}, {"id": "q8", "part": "notes", "tag": "Trap · samples vs law", "prompt": "Trap: you run G_θ on many Z~N(0,I). What do you actually have?", "options": [{"key": "A", "text": "The closed-form density p_θ, as if it were a GMM you wrote"}, {"key": "B", "text": "Samples from p_θ, which is not the same as knowing p_θ"}, {"key": "C", "text": "Samples from p_x"}, {"key": "D", "text": "A proof that D_f=0"}], "answer": "B", "whyCorrect": "MNIST wedge: a pile is not the law. G_θ emits a second pile.", "whyOthers": {"A": "Only if you defined p_θ explicitly.", "C": "Those are the dataset, not G_θ(Z).", "D": "Training is not done by running Z once."}, "diagram": "  HAVE: two clouds\n  LACK: two formulas", "useLater": "Topic 6 and the next lecture’s variational estimator.", "anchor": "NOTES.md#topic-6-samples-are-not-the-law-2034–2320"}, {"id": "q9", "part": "notes", "tag": "Numerical · f-div definition", "prompt": "The f-divergence integral on the board equals", "options": [{"key": "A", "text": "∫ p_x(x) f(p_θ(x)) dx"}, {"key": "B", "text": "∫ |p_x−p_θ| only"}, {"key": "C", "text": "∫ p_θ(x) f(p_x(x)/p_θ(x)) dx, with f convex, lsc, f(1)=0"}, {"key": "D", "text": "max(p_x,p_θ)"}], "answer": "C", "whyCorrect": "Weight p_θ times f of the ratio. That is why swapping the two hills is a different child.", "whyOthers": {"A": "Wrong weight and no ratio.", "B": "That is TV, one special f.", "D": "Not a divergence."}, "diagram": "  D_f = ∫ p_θ f(p_x/p_θ) dx", "useLater": "Topic 9: plug f(u)=u log u → KL.", "anchor": "NOTES.md#topic-8-vdm-family-f-divergence-definition-2700–3141"}, {"id": "q10", "part": "notes", "tag": "Worked · KL", "prompt": "Choosing f(u)=u log u recovers", "options": [{"key": "A", "text": "Total variation"}, {"key": "B", "text": "Jensen–Shannon"}, {"key": "C", "text": "Reverse KL only"}, {"key": "D", "text": "KL(p_x ∥ p_θ)=∫ p_x log(p_x/p_θ), whose minimizer is MLE"}], "answer": "D", "whyCorrect": "The p_θ in front cancels the denominator of the ratio. He identifies that KL min with MLE.", "whyOthers": {"A": "f=½|u−1|.", "B": "The half-u-log-u-minus-… formula.", "C": "A different f (his exercise: log u)."}, "diagram": "  u log u  →  KL  →  MLE", "useLater": "Topic 10: that KL fines missed modes, not junk.", "anchor": "NOTES.md#topic-9-properties-and-the-named-family-3141–3618"}, {"id": "q11", "part": "notes", "tag": "Connect · Topics 9–10", "prompt": "Which chain connects Topic 9’s two KLs to Topic 10’s two sins?", "options": [{"key": "A", "text": "Are the same number because KL is a metric"}, {"key": "B", "text": "Punish opposite sins: miss a real mode vs invent junk"}, {"key": "C", "text": "Are only defined for uniforms"}, {"key": "D", "text": "Both ignore p_θ"}], "answer": "B", "whyCorrect": "High p_x / low p_θ makes KL large (good). Low p_x / high p_θ makes KL small (junk cheap). Reverse KL inverts that.", "whyOthers": {"A": "He calls reverse KL a misnomer — two different f’s.", "C": "Any densities.", "D": "Both use both hills."}, "diagram": "  fwd KL: cover modes, junk cheap\n  rev KL: no junk, may drop a mode\n  JSD: average", "useLater": "Why the GAN zoo later unified under different f.", "anchor": "NOTES.md#topic-10-mode-cover-vs-junk-variational-next-3618–4230"}, {"id": "q12", "part": "notes", "tag": "Connect · VDM", "prompt": "Where do GANs sit in his chronology?", "options": [{"key": "A", "text": "They are the whole course"}, {"key": "B", "text": "They replace f-divergence"}, {"key": "C", "text": "They are one member of the VDM family that starts this chronology (then VAE, then diffusion)"}, {"key": "D", "text": "They are a nearest-neighbor estimator"}], "answer": "C", "whyCorrect": "VDM is the family; adversarial nets are a child. Order is pedagogical.", "whyOthers": {"A": "First family only.", "B": "GAN is an instance of using a D, not a replacement.", "D": "kNN was a non-sampler from last course."}, "diagram": "  VDM (GAN ∈ here) → VAE → diffusion", "useLater": "Next lecture: variational estimate of D_f.", "anchor": "NOTES.md#topic-8-vdm-family-f-divergence-definition-2700–3141"}, {"id": "q13", "part": "notes", "tag": "Trade-off · next", "prompt": "What does he postpone to the next class, and what should you refresh?", "options": [{"key": "A", "text": "How to estimate D_f from samples without the densities; refresh CLT, convergence, Markov/Chebyshev"}, {"key": "B", "text": "How to build a transformer from scratch"}, {"key": "C", "text": "The definition of f-divergence itself"}, {"key": "D", "text": "The two jobs of generative modeling"}], "answer": "A", "whyCorrect": "The integral needs p_x and p_θ; we have two clouds. Variational calculus is next. He names the probability refresh list.", "whyOthers": {"B": "Architecture-agnostic; tutorials maybe.", "C": "Defined this hour.", "D": "Topic 1."}, "diagram": "  STOP: variational D from samples\n  HW: CLT, Markov, Chebyshev", "useLater": "That is the 30–40% of the course he flagged in Topic 4.", "anchor": "NOTES.md#topic-10-mode-cover-vs-junk-variational-next-3618–4230"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
