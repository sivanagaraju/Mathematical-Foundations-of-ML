  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · saddle", "prompt": "On the VDM saddle, which parameters maximize the shared score J?", "options": [{"key": "A", "text": "The generator weights θ (ascent on G)"}, {"key": "B", "text": "The critic weights w (inner max on T_w / D_w)"}, {"key": "C", "text": "Both θ and w, in the same direction"}, {"key": "D", "text": "Neither — a saddle has no max"}], "answer": "B", "whyCorrect": "Inner problem is max_w J. The critic inflates the bound. θ minimizes the same J.", "whyOthers": {"A": "θ is the outer min — the sampler deflates J.", "C": "Same number, opposite directions — that is the saddle.", "D": "A saddle still has a max along one axis and a min along the other."}, "diagram": "  max_w  (critic)   ▲\n  min_θ  (G)     ──┼──  one J", "useLater": "Topics 1 and 5: alternate freeze-one steps.", "anchor": "PREREQUISITES.md#p1-saddle"}, {"id": "q2", "part": "prerequisites", "tag": "Definition · generator", "prompt": "Where does randomness live when you draw a fake x̂ = G_θ(z)?", "options": [{"key": "A", "text": "Inside G_θ: the net rolls dice on every forward pass"}, {"key": "B", "text": "Nowhere — fakes are a closed-form PDF"}, {"key": "C", "text": "In Z ~ N(0,I); G_θ is a deterministic map"}, {"key": "D", "text": "Only in the discriminator"}], "answer": "C", "whyCorrect": "Same z always gives the same x̂. New fakes come from new z, not from a random net.", "whyOthers": {"A": "He is explicit: the net does not roll dice.", "B": "The whole course is that we do not have that PDF.", "D": "D scores; it does not supply the noise."}, "diagram": "  z ~ N(0,I) --deterministic--> G_θ --> x̂ ~ p_θ", "useLater": "Topic 10: refresh thispersondoesnotexist = new z through trained G.", "anchor": "PREREQUISITES.md#p2-generator"}, {"id": "q3", "part": "prerequisites", "tag": "compare · critic vs D", "prompt": "When is it legal to call T_w a discriminator?", "options": [{"key": "A", "text": "Always — critic and discriminator are synonyms for every f"}, {"key": "B", "text": "Never — he forbids the word"}, {"key": "C", "text": "When last activation lands in (0,1) so T can be read as a binary classifier (GAN’s f)"}, {"key": "D", "text": "Only at inference, after D is discarded"}], "answer": "C", "whyCorrect": "GAN’s sigmoid puts D in (0,1). Change f (LSGAN) and T may be a regressor — the inspector story dies.", "whyOthers": {"A": "He postpones the nickname and later kills it for other f.", "B": "He uses the word for this f; he rejects it as the definition of VDM.", "D": "At inference D is gone; the name is about training."}, "diagram": "  VDM any f: T : X → dom(f*)   critic\n  GAN this f: D : X → (0,1)    critic + classifier reading", "useLater": "Topics 3, 6, 7.", "anchor": "PREREQUISITES.md#p3-critic"}, {"id": "q4", "part": "prerequisites", "tag": "numerical · sigmoid", "prompt": "If V_w(x) = 0, what is the sigmoid discriminator D_w(x)?", "options": [{"key": "A", "text": "0"}, {"key": "B", "text": "1"}, {"key": "C", "text": "undefined (divide by zero)"}, {"key": "D", "text": "1/2"}], "answer": "D", "whyCorrect": "D = 1/(1+e^{−V}). At V=0, e^0=1, so D=1/2. A confused inspector.", "whyOthers": {"A": "V→−∞ sends D→0, not V=0.", "B": "V→+∞ sends D→1.", "C": "1+e^0 = 2, perfectly defined."}, "diagram": "  V=2 → D≈0.88\n  V=0 → D=0.50\n  V=−2 → D≈0.12", "useLater": "Topic 3: D in (0,1) licenses the classifier nickname.", "anchor": "PREREQUISITES.md#p5-sigmoid"}, {"id": "q5", "part": "prerequisites", "tag": "Trap · freeze", "prompt": "On a generator step, which statement is true?", "options": [{"key": "A", "text": "You still need a batch of real MNIST; both terms depend on θ"}, {"key": "B", "text": "You freeze D’s weights, drop the real-data term, and backprop from D through G"}, {"key": "C", "text": "You delete D from the graph entirely"}, {"key": "D", "text": "You ascend on θ (same direction as D)"}], "answer": "B", "whyCorrect": "E_{p_x}[log D] does not see θ. Frozen ≠ deleted: you still evaluate D(G(z)). Descent on θ.", "whyOthers": {"A": "The real term is independent of θ and is taken off.", "C": "You still forward through D; you just do not update w.", "D": "G minimizes J; D maximizes it."}, "diagram": "  G-step: freeze w\n  z → G → x̂ → D  (D is a path)\n  ∇_θ only", "useLater": "Topics 4–5 pass counts.", "anchor": "PREREQUISITES.md#p7-freeze"}, {"id": "q6", "part": "notes", "tag": "Map · whole lecture", "prompt": "On the master map, what is this hour’s GAN?", "options": [{"key": "A", "text": "A new divergence family, unrelated to last hour’s VDM"}, {"key": "B", "text": "Exactly Jensen–Shannon minimization with a CNN"}, {"key": "C", "text": "One choice of f inside last hour’s VDM saddle, implemented with a last activation and alternate frozen steps"}, {"key": "D", "text": "The same algorithm as ChatGPT (autoregressive sampling)"}], "answer": "C", "whyCorrect": "He inverts history on purpose: GAN 2014 was first; VDM ~2016 generalized it. Today GAN is a specialization of VDM.", "whyOthers": {"A": "The opening tablet is last hour’s two-net saddle.", "B": "He warns: similar to JSD, missing a constant — not JSD.", "D": "Topic 10: ChatGPT is autoregressive, later in the course."}, "diagram": "  VDM saddle --choose f--> GAN’s f --σ_f--> sigmoid D --alternate--> trained G", "useLater": "Whole Exec Summary / method card.", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture"}, {"id": "q7", "part": "notes", "tag": "Trap · not JSD", "prompt": "People say “GAN optimizes JSD.” He says", "options": [{"key": "A", "text": "GAN’s f is similar to JSD’s f but missing a constant factor — not exactly JSD"}, {"key": "B", "text": "GAN is exactly JSD; the constant is decoration"}, {"key": "C", "text": "GAN minimizes reverse KL, not JSD"}, {"key": "D", "text": "GAN has no f at all"}], "answer": "A", "whyCorrect": "Board: f(u)=u log u − (u+1)log(u+1), “similar to JSD.” Remember this.", "whyOthers": {"B": "He spent a beat killing that slogan.", "C": "Reverse KL is another child of f-div, not this sitting’s f.", "D": "GAN is VDM with this particular f."}, "diagram": "  f_GAN(u)=u log u − (u+1)log(u+1)\n  JSD’s f has an extra constant factor", "useLater": "Topic 3.", "anchor": "NOTES.md#topic-3-gans-f-not-jsd-sigmoid-d-0923–1621"}, {"id": "q8", "part": "notes", "tag": "Trap · 2D counterexample", "prompt": "In the R^2 picture, the generator moves the fake cluster from p_θ1 to p_θ2 so D_w1 fails. Does that mean p_x = p_θ?", "options": [{"key": "A", "text": "Yes — classifier failure always implies the two laws are equal"}, {"key": "B", "text": "Yes if D_w1 was linear"}, {"key": "C", "text": "No: the fakes can sit in a new region that fools this D without overlapping p_x; retune D_w2"}, {"key": "D", "text": "The picture is only about MNIST topology, not laws"}], "answer": "C", "whyCorrect": "Board slogan: classifier failure does not imply p_x=p_θ. Keep playing: retune D, move G, repeat.", "whyOthers": {"A": "That hoped-for iff is exactly what the counterexample kills.", "B": "Linearity is not the escape hatch he offers.", "D": "It is a 2D cartoon of two laws and two classifiers."}, "diagram": "  p_x  X's     p_θ1 o's\n     \\ D_w1 /\n  p_θ2 o's  (D_w1 fails, laws still distinct)", "useLater": "Topic 6; why we must alternate D not freeze it forever.", "anchor": "NOTES.md#topic-6-classifier-guided-story-2d-counterexample-2546–3658"}, {"id": "q9", "part": "notes", "tag": "Connect · D-step vs G-step", "prompt": "Which chain is the D-step accounting he writes?", "options": [{"key": "A", "text": "1 forward G + 1 forward D + 1 backward G"}, {"key": "B", "text": "1 forward G + 2 forwards D (real and fake) + 1 backward D"}, {"key": "C", "text": "2 forwards G + 0 D (D is frozen so unused)"}, {"key": "D", "text": "Only a backward on G; D is deleted"}], "answer": "B", "whyCorrect": "D must see reals and fakes. G makes the fakes (one forward). Then two D forwards, one D backward (ascent on w).", "whyOthers": {"A": "That is closer to the G-step (1 G, 1 D, 1 bwd G via D).", "C": "D-step uses D twice; G is only a fake factory.", "D": "D is the student this step."}, "diagram": "  D-step: 1 fwd G + 2 fwd D + 1 bwd D\n  G-step: 1 fwd G + 1 fwd D + 1 bwd G via D", "useLater": "Topic 5.", "anchor": "NOTES.md#topic-5-freeze-pass-counts-not-11-2104–2546"}, {"id": "q10", "part": "notes", "tag": "Compare · LSGAN", "prompt": "Why does the classifier-guided story fail for LSGAN?", "options": [{"key": "A", "text": "LSGAN has no generator"}, {"key": "B", "text": "LSGAN uses the same f, so the story still holds"}, {"key": "C", "text": "Its f makes T a regressor, not a classifier — output is not a (0,1) inspector"}, {"key": "D", "text": "LSGAN is a convolutional architecture, not an f-choice"}], "answer": "C", "whyCorrect": "Least-squares GAN: T becomes a regressor. You cannot tell the inspector story. Think VDM, not Hollywood.", "whyOthers": {"A": "It is still a two-net VDM.", "B": "He named LSGAN as the counter to “always a classifier.”", "D": "DCGAN is the conv special case; LSGAN is an f-choice."}, "diagram": "  GAN f  → D in (0,1) → classifier story OK\n  LSGAN f → T regressor → story dies", "useLater": "Topic 7 alphabet-GAN zoo.", "anchor": "NOTES.md#topic-7-likelihood-derivation-adversarial-name-lsgan-3658–4355"}, {"id": "q11", "part": "notes", "tag": "Apply · cGAN", "prompt": "To sample MNIST conditioned on class “3”, the modification he wants is", "options": [{"key": "A", "text": "Concatenate a one-hot y into G and into D (score co-occurrence)"}, {"key": "B", "text": "Train a marginal GAN and pick the 3’s by hand after sampling"}, {"key": "C", "text": "Replace Gaussian Z by the class label alone"}, {"key": "D", "text": "Keep D at inference and ignore y"}], "answer": "A", "whyCorrect": "Pretty simple: concat z with y into G, and (x,y) into D. Objective becomes likelihood of co-occurrence.", "whyOthers": {"B": "A marginal sampler has no control over which digit appears.", "C": "Conditionals start from Y in addition to Z, not instead of a noise bag with no concat.", "D": "Inference discards D and must feed y if you want a class."}, "diagram": "  z ⊕ y → G → x̂ | y\n  x ⊕ y → D → score of the pair", "useLater": "Topic 9; prompts of GPTs are draws of Y.", "anchor": "NOTES.md#topic-9-conditional-concat-discard-d-4740–5446"}, {"id": "q12", "part": "notes", "tag": "tradeoff · inference", "prompt": "At inference, why is the discriminator discarded?", "options": [{"key": "A", "text": "It was never used in training either"}, {"key": "B", "text": "It only built the lower bound / guided G; a good teacher becomes redundant"}, {"key": "C", "text": "StyleGAN forbids two nets"}, {"key": "D", "text": "You still need D to sample z"}], "answer": "B", "whyCorrect": "T constructed the bound. Once G is trained, sample z (and y) through G only. Refresh = new z through G.", "whyOthers": {"A": "Training is exactly the two-net saddle.", "C": "StyleGAN still has a critic in training.", "D": "z is Gaussian noise, not D’s output."}, "diagram": "  TRAIN: G and D together\n  TEST:  z (⊕ y) → G* → new x     D gone", "useLater": "Topics 9–10.", "anchor": "NOTES.md#topic-9-conditional-concat-discard-d-4740–5446"}, {"id": "q13", "part": "notes", "tag": "Connect · next class", "prompt": "Why does he point next to optimal transport / Wasserstein GAN?", "options": [{"key": "A", "text": "Because ChatGPT is a WGAN"}, {"key": "B", "text": "Because DCGAN already solved every f-div issue"}, {"key": "C", "text": "Because Tutorial 12 will prove VDM always converges"}, {"key": "D", "text": "f-divergence is not the best metric (manifold hypothesis); OT also yields a saddle, similar paradigm"}], "answer": "D", "whyCorrect": "Closing minutes: f-div + manifold hyp is a problem they will talk about. OT / WGAN is the next algorithm class, still a saddle, then VAEs.", "whyOthers": {"A": "ChatGPT is autoregressive, not WGAN.", "B": "DCGAN changes architecture, not the divergence.", "C": "He said there is no convergence guarantee."}, "diagram": "  this hour: f-div VDM / GAN\n  next: OT / WGAN (manifold hyp)\n  later: VAE; AR / ChatGPT", "useLater": "Topic 10 STOP; Lec 18 in this playlist.", "anchor": "NOTES.md#topic-10-stylegan-demo-next-wgan-5446–5804"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
