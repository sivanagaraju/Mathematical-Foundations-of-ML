<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lec 16 Pedagogy in the Times of AI</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --panel2: #243044; --text: #e7ecf3;
      --muted: #9aabbf; --accent: #5b9fd4; --ok: #3dba7a; --bad: #e06c75;
      --warn: #e5c07b; --border: #2d3a4f;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #1a2838 0%, var(--bg) 100%); }
    header h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 52rem; }
    header a { color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; align-items: center; }
    .mode-toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .mode-toggle button { border: 0; background: transparent; color: var(--muted); padding: 0.45rem 0.9rem; cursor: pointer; font: inherit; }
    .mode-toggle button.active { background: var(--accent); color: #0b1220; font-weight: 600; }
    main { padding: 1.25rem 1.5rem 3rem; max-width: 52rem; margin: 0 auto; }
    .progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .qcard h2 { margin: 0 0 0.35rem; font-size: 1.02rem; font-weight: 650; }
    .qmeta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .opts { display: flex; flex-direction: column; gap: 0.45rem; }
    .opt { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: #1e3348; box-shadow: inset 0 0 0 1px var(--accent); }
    .opt input { margin-top: 0.25rem; accent-color: var(--accent); }
    .opt.reveal-correct { border-color: var(--ok); background: #163528; }
    .opt.reveal-wrong-picked { border-color: var(--bad); background: #3a1f24; }
    .q-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
    .q-actions button { font: inherit; border-radius: 8px; padding: 0.5rem 0.95rem; cursor: pointer; border: 1px solid var(--border); }
    .q-actions .check-btn { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    .q-actions .check-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .q-actions .clear-btn { background: var(--panel2); color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.25rem 0; position: sticky; bottom: 0; padding: 0.75rem 0; background: linear-gradient(transparent, var(--bg) 30%); }
    button.primary, button.secondary { font: inherit; border-radius: 8px; padding: 0.65rem 1.1rem; cursor: pointer; border: 1px solid var(--border); }
    button.primary { background: var(--accent); color: #0b1220; border-color: transparent; font-weight: 650; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--text); }
    .score { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.25rem; }
    .score.show { display: block; }
    .explain { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .explain.show { display: block; }
    .explain h3 { margin: 0.75rem 0 0.4rem; font-size: 0.92rem; color: var(--warn); }
    .verdict { font-weight: 650; margin-bottom: 0.5rem; }
    .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--muted); }
    .why { background: #121a24; border-radius: 8px; padding: 0.75rem 0.9rem; margin: 0.45rem 0; font-size: 0.92rem; }
    .why .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 0.25rem; }
    pre.diagram { font-family: var(--mono); font-size: 0.76rem; line-height: 1.35; background: #0b1018; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; overflow-x: auto; color: #c5d4e8; margin: 0.55rem 0; white-space: pre; }
    .later { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .wizard-nav { display: none; gap: 0.5rem; }
    body.mode-wizard .wizard-nav { display: flex; }
    body.mode-wizard .qcard { display: none; }
    body.mode-wizard .qcard.active { display: block; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 1rem 2rem; }
    .part-banner { margin: 1.25rem 0 0.75rem; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: #152032; }
    .part-banner h2 { margin: 0 0 0.25rem; font-size: 1.05rem; color: var(--accent); }
    .part-banner p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .part-banner.notes { border-color: #3d5a40; background: #15241a; }
    .part-banner.notes h2 { color: var(--ok); }
    .part-pill { display: inline-block; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 999px; margin-right: 0.4rem; }
    .part-pill.prereq { background: #1e3a55; color: #8ec8f0; }
    .part-pill.notes { background: #1e4030; color: #8fe0b0; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
  </style>
</head>
<body class="mode-all">
  <header>
    <h1>Lec 16 Pedagogy in the Times of AI</h1>
    <p><strong>Two parts:</strong> <em>Part A</em> = <a href="./PREREQUISITES.md">PREREQUISITES.md</a> · <em>Part B</em> = <a href="./NOTES.md">NOTES.md</a>. This video only.</p>
    <p class="hint" style="margin-top:0.5rem">Pick an option → <strong>Check this answer</strong> on that card to see why (per question). Optional: <strong>Score all</strong> for totals.</p>
    <div class="toolbar">
      <div class="mode-toggle">
        <button type="button" id="mode-all" class="active">All at once</button>
        <button type="button" id="mode-wizard">One at a time</button>
      </div>
    </div>
  </header>
  <main>
    <div class="progress" id="progress"></div>
    <div class="score" id="score"></div>
    <div id="questions"></div>
    <div class="actions">
      <button type="button" class="primary" id="submit">Score all answered</button>
      <button type="button" class="secondary" id="reset">Reset all</button>
      <div class="wizard-nav">
        <button type="button" class="secondary" id="prev">← Prev</button>
        <button type="button" class="secondary" id="next">Next →</button>
      </div>
    </div>
  </main>
  <footer>Per-video quiz · check each question · Part A prereqs + Part B notes</footer>
  <script>
    const QUESTIONS = [{"id": "q01", "part": "prerequisites", "flavor": "definition", "prompt": "What is the fundamental cause of the 'Illusion of Competence' when students study technical subjects exclusively through conversational AI?", "options": ["The AI generates answers with high conversational fluency, tricking the brain into feeling understanding while inducing near-zero germane cognitive load in long-term memory.", "Language models only provide answers in compressed 8-bit floating point representations that human vision cannot decode.", "The student fails to adjust the softmax temperature parameter to exact zero.", "The neural network runs backpropagation on the student's hardware in real time."], "answer": "A", "whyCorrect": "High fluency removes extraneous friction, which feels pleasant, but durable learning requires germane cognitive effort. Without active derivation, long-term memory schemas fail to form.", "whyOthers": "B, C, and D are absurd technical distractions unrelated to cognitive psychology.", "diagram": null, "anchor": "foundational-pillar-2-cognitive-load-theory-and-the-illusion-of-competence"}, {"id": "q02", "part": "prerequisites", "flavor": "compare", "prompt": "How does Geoffrey Hinton characterize the economic consequence of AI abundance in capitalistic market structures, as discussed in Lecture 16?", "options": ["Abundance automatically guarantees universal happiness and immediate economic equity across all social classes.", "Abundance creates a severe distribution crisis where value and power concentrate exclusively in the hands of a few entities controlling massive GPU infrastructure.", "Generative AI increases physical manufacturing costs, causing immediate inflation in raw materials.", "AI eliminates the need for software engineering by turning all computers into quantum machines."], "answer": "B", "whyCorrect": "Hinton argues that intelligence commoditization does not translate to universal flourishing under capitalism; it creates an extreme distribution problem where 100k GPU owners become feudal lords.", "whyOthers": "A is the naive utopian view explicitly rejected in lecture. C and D are false economic and technological claims.", "diagram": null, "anchor": "foundational-pillar-1-epistemic-asymmetry-generation-vs-verification-complexity"}, {"id": "q03", "part": "prerequisites", "flavor": "numerical", "prompt": "If a student absorbs technical concepts with a half-life of S = 1 day under passive prompting, what percentage of knowledge remains after t = 7 days according to Ebbinghaus' decay curve R(t) = exp(-t/S)?", "options": ["10.00%", "5.00%", "0.09%", "14.28%"], "answer": "C", "whyCorrect": "R(7) = exp(-7 / 1) = exp(-7) = 1 / 1096.63 = 0.0009119 = 0.091%. Less than one-tenth of one percent remains.", "whyOthers": "A is a rough guess. B is 1/20th. D is 1/7th.", "diagram": null, "anchor": "foundational-pillar-2-cognitive-load-theory-and-the-illusion-of-competence"}, {"id": "q04", "part": "notes", "flavor": "definition", "prompt": "In the instructor's 'Intellectual Gym' metaphor, why should students continue coming to physical university classrooms despite having access to frontier AI at home?", "options": ["Because university computers have faster keyboards than consumer laptops.", "Because campus cafeterias provide subsidized food for graduate researchers.", "Because physical classrooms provide legal immunity against copyright claims.", "Because the university provides structured discipline, social motivation, and live Socratic friction that compel students to exert intense cognitive effort."], "answer": "D", "whyCorrect": "Just as people pay for physical gyms despite having dumbbells at home to benefit from social presence, routine, and discipline, university classrooms enforce rigorous cognitive struggle.", "whyOthers": "A, B, and C are trivial or fabricated rationales.", "diagram": null, "anchor": "topic-5-the-university-as-an-intellectual-gym-discipline-socialization-and-embodied-socratic-dialectic"}, {"id": "q05", "part": "notes", "flavor": "tradeoff", "prompt": "What is the primary danger of 'Token Dependency' when a practitioner relies entirely on generative AI for code implementation and mathematical derivation?", "options": ["The practitioner loses epistemic agency and becomes incapable of detecting subtle mathematical bugs, hallucinations, or distribution shifts.", "The language model charges higher credit card fees for each additional token requested.", "The PyTorch optimizer automatically throttles GPU clock speeds when detecting AI code.", "The model weights get deleted from disk after 100 consecutive prompts."], "answer": "A", "whyCorrect": "Delegating reasoning turns engineers into blind consumers who cannot diagnose root causes or invent novel architectures when off-the-shelf templates fail.", "whyOthers": "B, C, and D are either commercial details or technical falsehoods.", "diagram": null, "anchor": "topic-3-token-dependency-vs-mathematical-sovereignty-the-hazard-of-cognitive-outsourcing-to-ai-lords"}, {"id": "q06", "part": "notes", "flavor": "compare", "prompt": "How does Bloom's Taxonomy invert in the age of generative AI, according to modern pedagogical frameworks?", "options": ["Remembering becomes the highest tier, while Creating is permanently eliminated.", "Low-level execution, syntax memorization, and boilerplate generation are automated, shifting human cognitive focus to high-level verification, critique, and first-principles formulation.", "Evaluation is exclusively handled by compiler error flags.", "All six levels of Bloom's taxonomy collapse into prompt tokenization."], "answer": "B", "whyCorrect": "Generative AI handles low-level execution (writing boilerplate code, recalling syntax). The human engineer's competitive moat elevates to verification, architectural judgment, and invariant critique.", "whyOthers": "A inverts the hierarchy incorrectly. C and D are dismissive oversimplifications.", "diagram": null, "anchor": "topic-4-the-inverted-classroom--blooms-taxonomy-transitioning-from-execution-to-first-principles-verification"}, {"id": "q07", "part": "notes", "flavor": "scenario", "prompt": "A graduate student uses an LLM to generate a custom score-matching loss function. The training runs without throwing Python exceptions, but the synthesized samples look like uniform gray noise. What is the mathematically sovereign way to debug this?", "options": ["Ask the LLM 'why is it gray?' ten times until the model changes its code.", "Increase the batch size by 100x and train for 50 more epochs blindly.", "Write a standalone 15-line NumPy script to numerically verify Tweedie's score formula on 1D Gaussian targets and assert analytical equivalence against ground truth.", "Switch from PyTorch to TensorFlow without inspecting the loss equation."], "answer": "C", "whyCorrect": "A sovereign practitioner isolates the core mathematical formula, writes a minimal numerical test on known ground-truth distributions, and asserts analytical invariants.", "whyOthers": "A is token dependency. B wastes GPU hours. D is irrational framework hopping.", "diagram": null, "anchor": "workplace-debugging-scenarios"}, {"id": "q08", "part": "notes", "flavor": "numerical", "prompt": "In the proposed 45-minute Dual Dialectic pedagogical model, how is a 90-minute classroom session structured?", "options": ["10 minutes of announcements and 80 minutes of uninterrupted professor lecturing.", "90 minutes of independent silent coding with headphones on.", "45 minutes of multiple choice quiz exams followed by 45 minutes of grading.", "45 minutes of intense self-directed AI research/drafting followed by 45 minutes of high-stakes peer and instructor dialectical debate."], "answer": "D", "whyCorrect": "The instructor explicitly proposes dividing class into two equal halves: 45 minutes to master a targeted concept using AI tools, followed by 45 minutes of live interactive dialectic.", "whyOthers": "A is the obsolete traditional format. B lacks social dialectic. C is bureaucratic testing.", "diagram": null, "anchor": "topic-6-the-frontier-competency-model-the-45-minute-dual-dialectic-and-lifelong-self-correcting-mastery"}, {"id": "q09", "part": "notes", "flavor": "master-map", "prompt": "How does Lecture 16 integrate with the preceding 46 technical lectures on linear algebra, probability, VAEs, and diffusion?", "options": ["It provides the meta-cognitive and philosophical compass, proving that the rigorous mathematics learned in previous lectures is the only safeguard against obsolescence in an AI-dominated economy.", "It declares that all prior 46 lectures were completely useless and should be deleted.", "It claims that linear algebra is no longer necessary because LLMs understand matrices instinctively.", "It acts as an isolated administrative lecture with no connection to generative models."], "answer": "A", "whyCorrect": "The instructor emphasizes that mastering mathematical foundations gives students sovereignty, preventing them from being rendered economically obsolete by automated code generators.", "whyOthers": "B, C, and D directly contradict the entire purpose and transcript of the IISc course.", "diagram": null, "anchor": "executive-summary"}, {"id": "q10", "part": "notes", "flavor": "trap", "prompt": "What common trap do engineering organizations fall into when adopting generative AI coding assistants across their teams?", "options": ["They experience a 50% drop in electricity bills due to faster typing.", "They run out of hard drive space because token files are excessively large.", "They mistake increased lines-of-code output for genuine productivity, while accumulating hidden technical debt and subtle architectural bugs that junior engineers cannot diagnose.", "The compiler refuses to build code unless the license key is paid daily."], "answer": "C", "whyCorrect": "Superficial throughput (lines of code generated) increases dramatically, but because junior engineers do not deeply understand the generated code, technical debt and fatal edge cases compound silently.", "whyOthers": "A, B, and D are fabricated non-sequiturs.", "diagram": null, "anchor": "workplace-debugging-scenarios"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
