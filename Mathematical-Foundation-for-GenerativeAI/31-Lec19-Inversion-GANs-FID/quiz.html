  <script>
    const QUESTIONS = [{"id": "q1", "part": "prerequisites", "tag": "Definition · ambient vs latent", "prompt": "A flattened 28×28 digit lives in which space, and a 10-number GAN code lives in which space?", "options": [{"key": "A", "text": "Both live in R^K because pixels are already a code"}, {"key": "B", "text": "Digit in ambient R^D with D=784; code in latent R^K with K=10"}, {"key": "C", "text": "Digit in R^K; code in ambient R^784"}, {"key": "D", "text": "Both live in ImageNet Inception space"}], "answer": "B", "whyCorrect": "Ambient is the pixel grid (D=28×28=784). Latent/code is the small list of knobs (K=10).", "whyOthers": {"A": "Pixels are the data, not the compressed code.", "C": "Swaps the two rooms.", "D": "Inception space is the FID museum, later."}, "diagram": "  z in R^K (K=10)  --> G -->  x in R^D (D=784)", "useLater": "Topic 1: sampler draws z in R^K and paints R^D.", "anchor": "PREREQUISITES.md#p1-ambient-latent"}, {"id": "q2", "part": "prerequisites", "tag": "Compare · manifold", "prompt": "Why does a GAN typically start in a much smaller K than the pixel dimension D?", "options": [{"key": "A", "text": "Because D must equal K for invertibility"}, {"key": "B", "text": "Because PCA forbids K < D"}, {"key": "C", "text": "Because FID requires K=2048"}, {"key": "D", "text": "Manifold hypothesis: useful data sit on a thin subset of R^D"}], "answer": "D", "whyCorrect": "Almost every random pixel grid is garbage. Faces/digits occupy far fewer degrees of freedom, so a small z can still crawl the useful sheet.", "whyOthers": {"A": "Inversion does not require K=D.", "B": "PCA *uses* K < D.", "C": "FID’s embedding width is unrelated to G’s noise size; he also never named 2048."}, "diagram": "  cube R^D almost empty of faces\n  thin sheet ≈ manifold\n  z in R^K --G--> a point on the sheet", "useLater": "Topic 1: he answers ‘why K < D?’ with the manifold hypothesis.", "anchor": "PREREQUISITES.md#p2-manifold"}, {"id": "q3", "part": "prerequisites", "tag": "Trap · joint vs marginal", "prompt": "Two pair-clouds have the same photo-marginal p(x). Must their joints p(x,z) match?", "options": [{"key": "A", "text": "No — the pairing (which z is stapled to which x) can still differ"}, {"key": "B", "text": "Yes — equal marginals imply equal joints"}, {"key": "C", "text": "Yes if K ≪ D"}, {"key": "D", "text": "Yes if both clouds are Gaussian"}], "answer": "A", "whyCorrect": "A joint is a law on tuples. Matching one side (photos) does not force the coupling. BiGAN matches the packets (x, E(x)) vs (G(z), z).", "whyOthers": {"B": "That implication is backwards: joints ⇒ marginals, not the other way.", "C": "Manifold size does not fix couplings.", "D": "Gaussian is the FID assumption, not a joint-equality theorem."}, "diagram": "  same heights, same weights, WRONG pairs\n  vs matching the list of (height, weight) tuples", "useLater": "Topic 7: D classifies tuples so joints match.", "anchor": "PREREQUISITES.md#p4-joint-marginal"}, {"id": "q4", "part": "prerequisites", "tag": "Compare · decoder-only", "prompt": "How does a vanilla GAN differ from PCA on the encoder/decoder rack?", "options": [{"key": "A", "text": "Both are encoder–decoder models with a round-trip"}, {"key": "B", "text": "GAN is encoder-only; PCA is decoder-only"}, {"key": "C", "text": "GAN is decoder-only (samples, cannot ingest x); PCA is encoder-only (projects, no Gaussian sampler G)"}, {"key": "D", "text": "Neither maps between R^K and R^D"}], "answer": "C", "whyCorrect": "G only maps z→x. PCA only projects x→codes. BiGAN/VAE later own both arrows.", "whyOthers": {"A": "Vanilla GAN has no E.", "B": "Arrows are swapped.", "D": "That is exactly what they do — in opposite directions."}, "diagram": "  GAN: z --> G --> x̂\n  PCA: x --> project --> ẑ", "useLater": "Topic 5 hangs those nameplates.", "anchor": "PREREQUISITES.md#p6-decoder-only"}, {"id": "q5", "part": "prerequisites", "tag": "Definition · FID museum", "prompt": "FID computes Wasserstein-2 on which objects?", "options": [{"key": "A", "text": "Raw pixels of real vs generated images"}, {"key": "B", "text": "Two Gaussians fitted on frozen Inception embeddings of those images"}, {"key": "C", "text": "The GAN discriminator’s last-layer logits"}, {"key": "D", "text": "PCA scores of the training set only"}], "answer": "B", "whyCorrect": "Twist: embed with pretrained Inception, assume Gaussian, closed-form W2. Lower is better.", "whyOthers": {"A": "He explicitly says not W2 on pixels.", "C": "D is discarded for FID; Inception is a different frozen net.", "D": "PCA is the encoder-only example, not FID."}, "diagram": "  x, G(z) --> Inception φ --> two Gaussians --> W2 = FID", "useLater": "Topic 9 is this recipe; Topic 10 lists caveats.", "anchor": "PREREQUISITES.md#p8-inception"}, {"id": "q6", "part": "notes", "tag": "Map · whole lecture", "prompt": "Which chain is the architecture of this lecture?", "options": [{"key": "A", "text": "Train a VAE likelihood, then delete G, then report pixel MSE"}, {"key": "B", "text": "Replace WGAN by KL, then run PCA as the sampler"}, {"key": "C", "text": "Fit Inception first, then train G with FID as the loss"}, {"key": "D", "text": "Keep G as sampler; add E + tuple-D (BiGAN/ALI) so joints match; score samples with FID"}], "answer": "D", "whyCorrect": "Job is invert + score. Method is three-net tuple game. Payoff is E-then-G and FID = W2 of Inception Gaussians.", "whyOthers": {"A": "VAE is next class.", "B": "PCA is encoder-only, not a GAN sampler.", "C": "FID is post-training evaluation, not the training loss this hour."}, "diagram": "  z-->G-->x̂\n  x-->E-->ẑ\n  D on (x,E(x)) vs (G(z),z)\n  then FID on Inception clouds", "useLater": "Executive Summary method card.", "anchor": "NOTES.md#executive-summary--architecture-of-this-lecture"}, {"id": "q7", "part": "notes", "tag": "Definition · inversion", "prompt": "What is GAN inversion in this lecture’s sentence?", "options": [{"key": "A", "text": "Given x from p_x, find z such that G(z) ≈ x (“which normal point generated this?”)"}, {"key": "B", "text": "Given z, draw a new x from p_x directly"}, {"key": "C", "text": "Swap D and G so D becomes the sampler"}, {"key": "D", "text": "Minimize FID during every generator step"}], "answer": "A", "whyCorrect": "Inversion is the missing arrow: ingest this image, recover knobs that would reprint it.", "whyOthers": {"B": "That is ordinary sampling, which G already does.", "C": "D is still a critic (on tuples).", "D": "FID is evaluation after training."}, "diagram": "  given x*   find z*  with  G(z*) ≈ x*", "useLater": "Topic 5 names inversion; Topic 8 uses E then G.", "anchor": "NOTES.md#topic-5-inversion-gan-is-decoder-only-0929–1117"}, {"id": "q8", "part": "notes", "tag": "Compare · BiGAN vs ALI", "prompt": "How does he place BiGAN relative to ALI?", "options": [{"key": "A", "text": "BiGAN is WGAN; ALI is a VAE"}, {"key": "B", "text": "ALI appeared a decade later and replaced BiGAN"}, {"key": "C", "text": "Same idea, two concurrent papers, same conference, same year"}, {"key": "D", "text": "BiGAN uses tuples; ALI classifies lone images"}], "answer": "C", "whyCorrect": "He stresses concurrent submissions and a research-overlap anecdote. One title is BiGAN, the other is adversarially learned inference.", "whyOthers": {"A": "Wrong families.", "B": "He says same year, same venue.", "D": "He treats the mechanism as the same tuple game."}, "diagram": "  three nets in both: G, E, D\n  two titles, one idea", "useLater": "Topic 6; then Topic 7 writes the tuples.", "anchor": "NOTES.md#topic-6-bigan-and-ali-1117–1343"}, {"id": "q9", "part": "notes", "tag": "Worked · tuple D", "prompt": "After adding encoder E, what two objects does D classify?", "options": [{"key": "A", "text": "Raw pixels x versus raw pixels G(z) only"}, {"key": "B", "text": "Tuples (x, E(x)) versus (G(z), z)"}, {"key": "C", "text": "Inception embeddings versus PCA scores"}, {"key": "D", "text": "The scalar FID versus the Inception Score"}], "answer": "B", "whyCorrect": "Treat z as extra dimensions of the data. Matching those pair-clouds matches joints, hence all marginals.", "whyOthers": {"A": "That was vanilla GAN; he says previously x vs x̂, now pairs.", "C": "Those are evaluation / classical reduction, not D’s inputs.", "D": "Metrics, not training pairs."}, "diagram": "  fake pair: (G(z), z)\n  real pair: (x, E(x))\n  min over (θ AND E)", "useLater": "Topic 7; homework in Topic 8 is ‘opt when joints match’.", "anchor": "NOTES.md#topic-7-tuple-discriminator-and-joints-1343–1709"}, {"id": "q10", "part": "notes", "tag": "Connect · Topic 5 to Topic 8", "prompt": "How does Topic 8 use the inverter that Topic 5 said was missing?", "options": [{"key": "A", "text": "It discards E and inverts by running pixel W2 on z"}, {"key": "B", "text": "It trains PCA on G’s samples and calls that a GAN"}, {"key": "C", "text": "It reports FID instead of recovering x"}, {"key": "D", "text": "After BiGAN training, ẑ=E(x) then x_rec=G(ẑ) should recover the start image"}], "answer": "D", "whyCorrect": "Decoder-only GAN could not ingest x. Three-net training produces E. Inference is encode then sample; round-trip is the inversion test.", "whyOthers": {"A": "Pixel W2 is the FID trap, not inversion.", "B": "PCA stays encoder-only.", "C": "FID scores a pile; it does not invert one photo."}, "diagram": "  x --> E --> ẑ --> G --> x_rec ≈ x", "useLater": "Editing still needs that ẑ before a latent walk.", "anchor": "NOTES.md#topic-8-encode-then-sample-algebra-homework-1709–1832"}, {"id": "q11", "part": "notes", "tag": "Worked · FID = 0", "prompt": "You fit two Gaussians on Inception embeddings. If μ_r = μ_g and Σ_r = Σ_g, what is FID?", "options": [{"key": "A", "text": "0, because closed-form W2 of identical Gaussians is zero (lower is better)"}, {"key": "B", "text": "1, because FID is a probability"}, {"key": "C", "text": "D, the pixel dimension"}, {"key": "D", "text": "Undefined unless you know the 68th layer"}], "answer": "A", "whyCorrect": "FID = ||μ_r−μ_g||² + Tr(Σ_r+Σ_g−2(Σ_r Σ_g)^{1/2}). Equal Gaussians give 0. He says lower FID ⇒ better.", "whyOthers": {"B": "FID is a distance-style score, not a probability.", "C": "Pixel D never enters the closed form.", "D": "He forgets the layer; the formula still runs on whatever vectors you tapped."}, "diagram": "  same oval blot twice  =>  W2 = 0 = FID", "useLater": "Topic 9 recipe; Topic 10: still why Gaussian / which layer.", "anchor": "NOTES.md#topic-9-fid--w_2-of-inception-gaussians-1832–2446"}, {"id": "q12", "part": "notes", "tag": "Trap · FID twist", "prompt": "Which move drops the ‘twist’ he says FID adds to Wasserstein-2?", "options": [{"key": "A", "text": "Freezing Inception weights"}, {"key": "B", "text": "Using equal n real and n generated images"}, {"key": "C", "text": "Computing W2 on raw pixels instead of Inception embeddings"}, {"key": "D", "text": "Reporting lower FID as better"}], "answer": "C", "whyCorrect": "FID is W2 between true and generated with a twist: not on images, on tapped Inception vectors, then Gaussian closed form.", "whyOthers": {"A": "Frozen pretrained net is required.", "B": "That is his sample-estimate setup.", "D": "That is the correct monotone."}, "diagram": "  WRONG: W2(pixels, pixels)\n  RIGHT: W2(Gaussians of φ(x), φ(G(z)))", "useLater": "Failure lane in the Executive Summary.", "anchor": "NOTES.md#topic-9-fid--w_2-of-inception-gaussians-1832–2446"}, {"id": "q13", "part": "notes", "tag": "Trade-off · after adversarial block", "prompt": "He closes the adversarial block. What does he say about image SOTA, and what is next class?", "options": [{"key": "A", "text": "GANs are SOTA; next class is more discriminators on pixels"}, {"key": "B", "text": "Minmax is not image SOTA (diffusion is); next is LVMs with encoder and decoder baked in (VAE, diffusion, AR)"}, {"key": "C", "text": "FID replaces training; next class is only PEFT"}, {"key": "D", "text": "Inception Score is SOTA; next class is PCA"}], "answer": "B", "whyCorrect": "Diffusion currently wins image generation. The critique+sampler *idea* still lives (agents, PEFT). Next family: VAEs/diffusion/AR with both arrows by construction.", "whyOthers": {"A": "He explicitly says minmax is not SOTA for images.", "C": "PEFT is an example of the idea carrying, not the next lecture.", "D": "Inception Score is an alternate metric that drops Gaussians."}, "diagram": "  adversarial block closes\n  idea carries (agents / PEFT)\n  next: VAE | diffusion | AR", "useLater": "Lec 20 starts the VAE.", "anchor": "NOTES.md#topic-10-fid-caveats-agents-next-lvms-2446–2812"}];
    const state = { answers: {}, checked: {}, wizardIndex: 0 };
    const $questions = document.getElementById("questions");
    const $score = document.getElementById("score");
    const $progress = document.getElementById("progress");

    function partOf(q) { return q.part === "notes" ? "notes" : "prerequisites"; }

    function fixLink(q) {
      const defaultFix = partOf(q) === "notes" ? "NOTES.md" : "PREREQUISITES.md";
      let fixHref = "./" + defaultFix, fixLabel = defaultFix;
      if (q.anchor) {
        const a = String(q.anchor).trim();
        if (a.startsWith("#")) { fixHref = "./" + defaultFix + a; fixLabel = defaultFix + a; }
        else if (a.startsWith("./")) { fixHref = a; fixLabel = a.slice(2); }
        else { fixHref = "./" + a; fixLabel = a; }
      }
      return { fixHref, fixLabel };
    }

    function explainHtml(q, picked, show) {
      if (!show) return "";
      let verdictClass = "skip", verdictText = "No answer selected.";
      if (picked) {
        const ok = picked === q.answer;
        verdictClass = ok ? "ok" : "bad";
        verdictText = ok
          ? `Correct — you chose ${picked}.`
          : `Not quite — you chose ${picked}; correct is ${q.answer}.`;
      } else {
        verdictText = `No answer — correct is ${q.answer}.`;
      }
      const whyWrong = Object.entries(q.whyOthers || {})
        .map(([k,v]) => `<div class="why"><div class="label">Why not ${k}?</div>${v}</div>`).join("");
      const { fixHref, fixLabel } = fixLink(q);
      return `<div class="explain show">
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <h3>Why the correct option (${q.answer})</h3>
        <div class="why"><div class="label">Explanation</div>${q.whyCorrect || ""}</div>
        <h3>Why not the other options</h3>${whyWrong}
        <h3>Picture</h3><pre class="diagram">${q.diagram || ""}</pre>
        <div class="later"><strong>Use later:</strong> ${q.useLater || ""}<br/>
        <strong>If wrong:</strong> re-read <a href="${fixHref}" style="color:var(--accent)">${fixLabel}</a></div>
      </div>`;
    }

    function render() {
      let html = "";
      let lastPart = null;
      QUESTIONS.forEach((q, i) => {
        const part = partOf(q);
        if (part !== lastPart) {
          lastPart = part;
          if (part === "prerequisites") {
            html += `<div class="part-banner prereq"><h2>Part A · PREREQUISITES.md</h2><p>Warm-up. Weak here → re-open PREREQUISITES.md.</p></div>`;
          } else {
            html += `<div class="part-banner notes"><h2>Part B · NOTES.md</h2><p>Article spine. Weak here → re-open NOTES.md (not only the video).</p></div>`;
          }
        }
        const picked = state.answers[q.id];
        const show = !!state.checked[q.id];
        const opts = q.options.map(o => {
          let cls = "opt" + (picked === o.key ? " selected" : "");
          if (show) {
            if (o.key === q.answer) cls += " reveal-correct";
            else if (picked === o.key) cls += " reveal-wrong-picked";
          }
          return `<label class="${cls}"><input type="radio" name="${q.id}" value="${o.key}" ${picked===o.key?"checked":""} ${show?"disabled":""}/><span><strong>${o.key}.</strong> ${o.text}</span></label>`;
        }).join("");
        const pill = part === "notes"
          ? `<span class="part-pill notes">NOTES</span>`
          : `<span class="part-pill prereq">PREREQ</span>`;
        const { fixLabel } = fixLink(q);
        const checkDisabled = show ? "disabled" : "";
        html += `<section class="qcard ${i===state.wizardIndex?"active":""}" data-idx="${i}" data-id="${q.id}" data-part="${part}">
          <h2>Q${i+1}. ${q.prompt}</h2>
          <div class="qmeta">${pill}${q.tag || ""} · review: ${fixLabel}</div>
          <div class="opts">${opts}</div>
          <div class="q-actions">
            <button type="button" class="check-btn" data-check="${q.id}" ${checkDisabled}>Check this answer</button>
            <button type="button" class="clear-btn" data-clear="${q.id}">Clear</button>
          </div>
          ${explainHtml(q, picked, show)}
        </section>`;
      });
      $questions.innerHTML = html;

      $questions.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          if (state.checked[input.name]) return;
          state.answers[input.name] = input.value;
          updateProgress();
          // refresh selected styling without wiping other checks
          render();
        });
      });
      $questions.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-check");
          if (!state.answers[id]) {
            alert("Pick an option first, then check this answer.");
            return;
          }
          state.checked[id] = true;
          render();
        });
      });
      $questions.querySelectorAll("[data-clear]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-clear");
          delete state.answers[id];
          delete state.checked[id];
          render();
        });
      });
      updateProgress();
      updateWizard();
    }

    function updateProgress() {
      const n = QUESTIONS.length;
      const a = Object.keys(state.answers).length;
      const ch = Object.keys(state.checked).length;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      let c = 0, cP = 0, cN = 0;
      QUESTIONS.forEach(q => {
        if (state.checked[q.id] && state.answers[q.id] === q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $progress.textContent =
        `Checked ${ch}/${n} · correct so far ${c} · answered ${a}/${n} · Part A ${nP} qs · Part B ${nN} qs`;
    }

    function updateWizard() {
      if (!document.body.classList.contains("mode-wizard")) return;
      document.querySelectorAll(".qcard").forEach((el,i) => el.classList.toggle("active", i===state.wizardIndex));
    }
    document.getElementById("mode-all").onclick = () => {
      document.body.classList.add("mode-all"); document.body.classList.remove("mode-wizard");
      document.getElementById("mode-all").classList.add("active");
      document.getElementById("mode-wizard").classList.remove("active");
    };
    document.getElementById("mode-wizard").onclick = () => {
      document.body.classList.add("mode-wizard"); document.body.classList.remove("mode-all");
      document.getElementById("mode-wizard").classList.add("active");
      document.getElementById("mode-all").classList.remove("active");
      updateWizard();
    };
    document.getElementById("prev").onclick = () => { state.wizardIndex = Math.max(0, state.wizardIndex-1); updateWizard(); };
    document.getElementById("next").onclick = () => { state.wizardIndex = Math.min(QUESTIONS.length-1, state.wizardIndex+1); updateWizard(); };

    document.getElementById("submit").onclick = () => {
      // score all that have answers; mark them checked
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]) state.checked[q.id] = true;
      });
      let c=0, cP=0, cN=0;
      const nP = QUESTIONS.filter(q => partOf(q)==="prerequisites").length;
      const nN = QUESTIONS.filter(q => partOf(q)==="notes").length;
      QUESTIONS.forEach(q => {
        if (state.answers[q.id]===q.answer) {
          c++;
          if (partOf(q)==="prerequisites") cP++; else cN++;
        }
      });
      $score.classList.add("show");
      $score.innerHTML = `<strong>Score (answered items): ${c} / ${QUESTIONS.length}</strong>
        <p style="margin:0.5rem 0 0"><strong>Part A · PREREQUISITES.md:</strong> ${cP}/${nP}
        &nbsp;·&nbsp; <strong>Part B · NOTES.md:</strong> ${cN}/${nN}</p>
        <p style="margin:0.4rem 0 0;color:var(--muted)">
          Missed Part A → <a href="./PREREQUISITES.md" style="color:var(--accent)">PREREQUISITES.md</a>.
          Missed Part B → <a href="./NOTES.md" style="color:var(--accent)">NOTES.md</a>.
          Unanswered items are not marked correct.
        </p>`;
      render();
    };
    document.getElementById("reset").onclick = () => {
      state.answers = {}; state.checked = {}; state.wizardIndex = 0;
      $score.classList.remove("show"); $score.innerHTML = ""; render();
    };
    render();
  </script>
</body>
</html>
